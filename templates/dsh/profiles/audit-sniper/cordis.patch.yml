# CTX-Audit DSH 狙击手 profile 模板（强模型深度判定）
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: ${DSH_SNIPER_PROVIDER:-opencode-go}
    model: ${DSH_SNIPER_MODEL:-deepseek-v4-flash}
    reasoningEffort: high
- insert:
    - id: mcp-ctx-audit
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ctxaudit
        transport: stdio
        command: !!js process.env.CTX_AUDIT_MCP_CMD || 'ctx-audit'
        args: ['mcp']
        failOnStartupError: false