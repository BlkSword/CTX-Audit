[package]
name = "ctx-audit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Security analysis daemon toolkit"

[[bin]]
name = "ctx-audit"
path = "src/main.rs"

[features]
# 默认不编译已搁置的 agent 模块（llm_mode=noop，结构变动时易断）。
# 需要 `ctx-audit audit --agent` 时使用 `--features agent` 构建。
default = []
agent = []

# agent 端到端测试依赖 --features agent 构建的二进制，默认构建跳过
[[test]]
name = "audit_agent_test"
path = "tests/audit_agent_test.rs"
required-features = ["agent"]

[dependencies]
# CLI 框架
clap = { workspace = true, features = ["derive"] }

# 终端 UI
indicatif = { workspace = true }
console = { workspace = true }

# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }
miette = { version = "7", features = ["fancy"] }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = "0.8"

# 异步运行时
tokio = { workspace = true }
async-trait = { workspace = true }

# 时间处理
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# HTTP 客户端
reqwest = { workspace = true }

# 目录工具
dirs = "5"
ignore = { workspace = true }

# 正则
regex = "1"
once_cell = "1.19"
rayon = "1.10"

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# 内部包
deepaudit-core = { workspace = true }
ctx-audit-tools = { workspace = true }
ctx-audit-daemon = { workspace = true }
ctx-audit-agent = { workspace = true }

# Unix API (守护进程管理)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows API (用于控制台操作)
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "wincon"] }
