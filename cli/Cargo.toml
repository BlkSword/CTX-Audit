[package]
name = "ctx-audit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AI-powered code security audit CLI tool"

[[bin]]
name = "ctx-audit"
path = "src/main.rs"

[dependencies]
# CLI 框架
clap = { workspace = true, features = ["derive"] }

# 终端 UI
indicatif = { workspace = true }
console = { workspace = true }
crossterm = { workspace = true }
rustyline = { workspace = true }
ratatui = "0.29"
tui-textarea = "0.7"
tui-input = "0.10"
syntect = "5.2"
flate2 = "1.0"
once_cell = "1.19"
regex = "1"

# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }
miette = { version = "7", features = ["fancy"] }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = "0.8"

# 异步运行时
tokio = { workspace = true }
async-trait = { workspace = true }
futures = "0.3"

# 时间处理
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# HTTP 客户端
reqwest = { workspace = true }

# 目录工具
dirs = "5"

# Windows API (用于控制台操作)
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "wincon"] }

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# 内部包
deepaudit-core = { workspace = true }
ctx-audit-agent-engine = { workspace = true }
ctx-audit-llm = { workspace = true }
ctx-audit-tools = { workspace = true }
