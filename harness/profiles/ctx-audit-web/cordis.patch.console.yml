# Optional overlay: mount the Vue audit console.
#
# The console host plugin (`dsh-ctx-audit-console`) is NOT part of this
# repository — it lives in the private dsh-plugins checkout. Apply this overlay
# only where that package is installed and linked into the profile:
#
#   dsh plugin --profile ctx-audit-web add link:<path-to>/dsh-ctx-audit-console
#   dsh --profile ctx-audit-web --patch harness/profiles/ctx-audit-web/cordis.patch.console.yml
#
# Without the overlay the profile still composes: the agent, the MCP tool
# surface and the `ctx-audit` preset all work; only the `/console` page is
# absent.

- insert:
    - id: ctx-audit-console
      name: 'dsh-ctx-audit-console'
      config:
        checkout: C:/project/CTX-Audit
        mount: /console
        apiMount: /api/console
