# Audit-specific overrides on top of the web template.
#
# The web app's own layer already supplies the shell, transport and client
# modules. This layer does two things the bundle cannot do for itself:
#
#   1. pin the MCP row to read-only, so an unattended agent cannot write
#      findings or close an analysis;
#   2. pin the provider/model.
#
# Remember that a patch REPLACES the targeted row's whole `config`, so every key
# the row owns has to be restated here — that is why the MCP row repeats
# serverName/transport/command/args instead of only overriding `args`.
#
# The bundle's own patch layer (plugins/ctx-audit-web/presets/ctx-audit.patch.yml)
# is what registers the `ctx-audit` agent preset and sets it as the deployment
# default; nothing here needs to restate that.
#
# The Vue console is NOT mounted here: its host plugin (`dsh-ctx-audit-console`)
# lives outside this repository and carries its own bundle patch, so installing
# it with `ctxa plugin add link:<path>` is all a deployment needs. Nothing in
# this file should reference it — a fresh install without that package must
# still compose, and a dangling row would fail to import and take the page down.

- insert: []

# The bundle's panel duplicates the Vue console; keep one sidebar entry.
- id: ctx-audit-web
  name: '@local/ctx-audit-web'
  disabled: true

# Read-only MCP surface: report_finding / finish_analysis are not registered,
# so the agent can gather evidence but cannot write verdicts back.
- id: ctx-audit-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: ctxaudit
    transport: stdio
    command: C:/project/CTX-Audit/target/release/ctx-audit.exe
    args: [ 'mcp', '--read-only' ]
    cwd: C:/project/CTX-Audit
    failOnStartupError: false

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    # Command Code route. `deepseek-v4.1-flash` is the model the audit rounds
    # were actually run on; `max` is its highest reasoning tier (the catalog
    # offers low/high/max). Requires the @mars-sea/dsh-commandcode-provider
    # bundle and COMMANDCODE_API_KEY in the credential store.
    provider: commandcode
    model: deepseek/deepseek-v4.1-flash
    reasoningEffort: max
