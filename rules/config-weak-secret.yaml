category: security-misconfiguration
cwe: CWE-798
description: "检测硬编码的弱密钥或默认已知密钥。已知密钥使攻击者可以伪造 Session Cookie 和 JWT Token。（典型案例：Flask-AppBuilder bin/config.py 中硬编码 SECRET_KEY='thisismyscretkey'，Flask 默认 'development key'）"
id: config-weak-secret
language: all
name: "Weak or Default Secret Key"
owasp: "A02:2021-Cryptographic Failures"
patterns:
  - language: python
    pattern: '(?i)SECRET_KEY\s*=\s*[''"][^''"]{0,40}(dev\b|secret\b|key\b|test\b|password\b|changeme|thisismy|django-insecure|development.key)[^''"]{0,40}[''"]'
  - language: javascript
    pattern: '(?i)(secret|secretKey|JWT_SECRET)\s*[:=]\s*[''"][^''"]{0,20}(dev|secret|test|password)[^''"]{0,20}[''"]'
  - language: go
    pattern: '(?i)(SecretKey|JWTSecret)\s*=\s*"[^"]{0,20}(dev|secret|test)[^"]{0,20}"'
severity: critical
remediation: "从环境变量读取密钥：SECRET_KEY = os.environ.get('SECRET_KEY')。使用 python -c 'import secrets; print(secrets.token_hex(32))' 生成强随机密钥。"
references:
  - "https://cwe.mitre.org/data/definitions/798.html"
  - "https://github.com/dpgaspar/Flask-AppBuilder/security"
