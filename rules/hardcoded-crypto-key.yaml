id: "hardcoded-crypto-key"
name: "Hardcoded Cryptographic Key"
description: "检测硬编码加密密钥：密钥类变量（cipherKey/secretKey/aesKey 等）被赋予长常量字面量。硬编码密钥使依赖其机密性的安全机制完全失效（典型案例：Apache Shiro CVE-2016-4437，DEFAULT_CIPHER_KEY_BYTES 硬编码导致 rememberMe 反序列化 RCE）。"
severity: "high"
language: "all"
pattern: "(?i)(cipher|secret|private|aes|des|encryption|signing)[_-]?key\\w*\\s*(?:=|:)\\s*(?:[\\w.]*(?:decode|fromBase64|parseHex|fromHex)\\s*\\(\\s*)?[\"'](?=[a-z0-9_]*[A-Z+/=])[A-Za-z0-9+/=_-]{16,}[\"']"
cwe: "CWE-798"
owasp: "A02:2021-Cryptographic Failures"
remediation: "密钥应从安全配置（环境变量、KMS、Vault）注入，不得硬编码在源码中；已泄露的密钥应立即轮换；使用 generateNewKey() 等方式在部署时生成随机密钥。"
references:
  - "https://cwe.mitre.org/data/definitions/798.html"
  - "https://nvd.nist.gov/vuln/detail/CVE-2016-4437"
