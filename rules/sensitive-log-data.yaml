category: information-disclosure
cwe: CWE-532
owasp: "A09:2021-Security Logging and Monitoring Failures"
remediation: "脱敏处理敏感数据后再记录; 使用日志框架的过滤功能; 不记录密码、Token、信用卡号等敏感字段。"
references:
  - "https://owasp.org/www-project-web-security-testing-guide/"
  - "https://cwe.mitre.org/data/definitions/532.html"
description: 检测敏感信息记录到日志：密码、密钥等敏感信息被记录
id: sensitive-log-data
language: all
name: Sensitive Data in Logs
patterns:
  - language: java
    pattern: (?i)(log\.(info|debug|warn|error)|logger\.(info|debug|warn|error)|System\.(out|err)\.print).*\b(password|passwd|pwd|secret|token|api_key|apikey|private_key|credential)\b
  - language: javascript
    pattern: (?i)(console\.(log|warn|error|info)).*\b(password|passwd|secret|token|apiKey|api_key|privateKey|credential)\b
  - language: python
    pattern: (?i)(logger\.(info|debug|warning|error)|print\s*\().*\b(password|passwd|pwd|secret|token|api_key|private_key|credential)\b
severity: medium
