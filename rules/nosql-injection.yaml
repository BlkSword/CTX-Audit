category: injection
cwe: CWE-943
description: "检测 NoSQL 操作符注入：用户输入中的 $gt/$ne/$where/$regex 等操作符被直接合并到数据库查询中，绕过了参数化防护。典型案例：MongoDB Node.js 驱动中，如果请求 body 被整体传入 find()，攻击者可注入 {'$gt':''} 等操作符绕过认证或泄露数据。"
id: nosql-injection
language: all
name: "NoSQL Operator Injection Detection"
owasp: "A03:2021-Injection"
patterns:
  - language: javascript
    pattern: '(?i)(\.findOne?\s*\(\s*req\.body|\.findOne?\s*\(\s*request\.body|\.findOne?\s*\(\s*\{\s*\.\.\.req|\.updateMany?\s*\(\s*.*req\.)'
  - language: python
    pattern: '(?i)(\.find\(\s*\{\s*'\'\"\']?\$gt|\.find_one\(\s*\{\s*'\'\"\']?\$ne|collection\.find\(.*request\.|\.update_one\(.*request\.)'
  - language: javascript
    pattern: '(?i)\{\s*'\'\"\']?\$(?:gt|ne|lt|gte|lte|in|nin|regex|where|expr)\b'
  - language: python
    pattern: '(?i)\{\s*['\''\"]\$(?:gt|ne|lt|gte|lte|in|nin|regex|where|expr)\b'
severity: critical
remediation: "不要在数据库查询中直接使用用户提供的 JSON 对象。使用 mongo-sanitize 或 express-mongo-sanitize 库过滤操作符；对来自用户的键名做白名单校验。"
references:
  - "https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05.6-Testing_for_NoSQL_Injection"
  - "https://cwe.mitre.org/data/definitions/943.html"
