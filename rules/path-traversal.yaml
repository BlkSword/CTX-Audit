category: file-operation
cwe: CWE-22
description: 检测路径遍历风险：用户输入直接用于文件路径操作
id: path-traversal
language: all
name: Path Traversal Detection
owasp: "A01:2021-Broken Access Control"
remediation: "对用户提供的文件路径进行规范化处理（realpath）；验证路径是否在允许的目录范围内；使用白名单限制可访问的文件名。"
references:
  - "https://owasp.org/www-community/attacks/Path_Traversal"
  - "https://cwe.mitre.org/data/definitions/22.html"
patterns:
  - language: java
    # CVE-2026-16088 / CVE-2026-15326 回放反哺：补充 Path.resolve(受控名) 形态
    # （getter 源无 request 字样；*Name 后缀变量覆盖 themeName/entryName/getName() 等，
    #  判定是 LLM 的事，配置类 themeRoot.resolve(themeName) 由判定层排除）
    pattern: (?i)(new\s+File\s*\(|FileInputStream\s*\(|Path\.of\s*\(|Paths\.get\s*\().*(?:request|param|input|user)|\.resolve\s*\([^)]*(?:fileName|getFilename|getOriginalFilename|(?-i:[A-Za-z_.]*Name\b))
  - language: javascript
    pattern: '(?i)(readFile\s*\(|readFileSync\s*\(|writeFile\s*\(|writeFileSync\s*\(|fs\.open\s*\(|path\.join\s*\()[^)]*(?:req\.|request|param|input|user|socket\.on|callback)'
  - language: python
    pattern: '(?i)(open\s*\(|read_file\s*\(|file_get_contents\s*\().*(?:request|param|input|user)'
  - language: php
    pattern: (?i)(fopen\s*\(|readfile\s*\(|file_get_contents\s*\(|include\s*\(|require\s*\().*(?:\$_GET|\$_POST|\$_REQUEST|request|input)
# 修复形态为 resolve 之后紧跟 checkDirectoryTraversal 校验（先取路径后校验），
# 前缀语义看不到、文件级语义会被同文件 import/其他守卫误豁免，用后向窗口
sanitizers:
  - "checkDirectoryTraversal("
sanitizer_after_lines: 3
severity: high
