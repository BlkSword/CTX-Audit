category: injection
cwe: CWE-78
description: 检测命令注入风险：用户输入直接用于命令执行
id: command-injection
language: all
name: Command Injection Detection
owasp: "A03:2021-Injection"
remediation: "使用参数化的命令执行 API；避免在 subprocess 中使用 shell=True；对所有用户输入进行严格验证和白名单过滤后再传入命令执行函数。"
references:
  - "https://owasp.org/www-community/attacks/Command_Injection"
  - "https://cwe.mitre.org/data/definitions/78.html"
patterns:
  - language: java
    pattern: (?i)(Runtime\.getRuntime\(\)\.exec\s*\(|ProcessBuilder\s*\()
  - language: javascript
    pattern: (?i)(child_process\.exec\s*\(|child_process\.execSync\s*\(|child_process\.spawn\s*\(|require\s*\(\s*['\"]child_process['\"]\s*\))
  - language: python
    pattern: (?i)(subprocess\.(call|run|Popen)\s*\(|os\.system\s*\(|os\.popen\s*\()
  - language: php
    pattern: (?i)(shell_exec\s*\(|passthru\s*\(|popen\s*\(|system\s*\(|exec\s*\()
severity: critical
