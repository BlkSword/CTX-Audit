category: injection
cwe: CWE-78
description: "检测命令注入风险：用户输入直接用于命令执行。注意：spawn/execFile 使用数组参数且 shell:false 时风险较低，工具会自动检测安全屏障并降级。"
id: command-injection
language: all
name: Command Injection Detection
owasp: "A03:2021-Injection"
remediation: "使用参数化的命令执行 API（spawn/execFile + 数组参数 + shell:false）；避免使用 exec/execSync 拼接字符串；对所有用户输入进行严格验证和白名单过滤。"
references:
  - "https://owasp.org/www-community/attacks/Command_Injection"
  - "https://cwe.mitre.org/data/definitions/78.html"
patterns:
  # 高风险：exec/execSync 使用字符串拼接（经过 shell 解释）
  - language: javascript
    pattern: (?i)(child_process\.exec\s*\(|child_process\.execSync\s*\()
  # spawn 调用（安全屏障检测会识别 shell:false 并降级）
  - language: javascript
    pattern: (?i)(child_process\.spawn\s*\(|\.spawn\s*\()
  # Java：要求 new ProcessBuilder( 构造形式，避免命中异常消息字符串字面量中的 "ProcessBuilder(...)"
  - language: java
    pattern: (?i)(Runtime\.getRuntime\(\)\.exec\s*\(|new\s+ProcessBuilder\s*\()
  # Python：os.system/os.popen 始终高危；subprocess 列表形式（无 shell=True）安全，用负向前瞻排除
  - language: python
    pattern: (?i)(os\.system\s*\(|os\.popen\s*\(|subprocess\.(call|run|Popen)\s*\(\s*(?!\[))
  # PHP
  - language: php
    pattern: (?i)(shell_exec\s*\(|passthru\s*\(|popen\s*\(|system\s*\(|exec\s*\()
severity: critical
