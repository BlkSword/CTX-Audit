category: injection
cwe: CWE-94
description: "检测代码注入风险：动态代码执行。注意：dev-only 工具脚本（构建/测试）中的 eval 使用会被标记为 build 角色。"
id: code-injection
language: all
name: Code Injection Detection
owasp: "A03:2021-Injection"
remediation: "避免使用 eval()、new Function() 等动态代码执行函数；使用白名单验证所有用户输入；对于模板引擎，使用沙箱环境执行。"
references:
  - "https://owasp.org/www-community/attacks/Code_Injection"
  - "https://cwe.mitre.org/data/definitions/94.html"
patterns:
  - language: javascript
    pattern: (?i)(eval\s*\(|new\s+Function\s*\(|setTimeout\s*\(\s*['"]|setInterval\s*\(\s*['"]|vm\.runInNewContext|vm\.runInThisContext|vm\.runInContext|engine\.parse\s*\(|\.parseAndCompile\s*\(|template\.compile\s*\(|ejs\.compile\s*\(|ejs\.render\s*\(|Handlebars\.compile\s*\(|nunjucks\.renderString\s*\()
  - language: python
    # eval/exec 前不能紧跟标识符：排除 ast.literal_eval、cursor.execute 等安全 API
    # compile 前不能紧跟标识符/点号：排除 re.compile、Pattern.compile 等正则编译 API
    pattern: (?i)((?:^|[^a-zA-Z_])eval\s*\(|(?:^|[^a-zA-Z_])exec\s*\(|__import__\s*\(|(?:^|[^\w.])compile\s*\()
  - language: java
    pattern: (?i)(ScriptEngineManager|GroovyShell|ScriptEngine\.eval|SpelExpressionParser|parseExpression|Ognl\.(get|set)Value|MVEL\.eval|MVEL\.executeExpression)
  - language: php
    pattern: (?i)(eval\s*\(|assert\s*\(|create_function\s*\(|preg_replace\s*\(.*/[a-z]*e[a-z]*['"])
# CVE-2022-22963 回放反哺：SpEL 修复形态是求值上下文换成 SimpleEvaluationContext
# （SimpleEvaluationContext 默认禁用类型引用/反射，无 RCE 面），文件级豁免
sanitizers:
  - "SimpleEvaluationContext"
sanitizer_file_scope: true
severity: critical
