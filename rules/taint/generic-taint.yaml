kind: taint-rules
name: "Generic Taint Rules"
version: "1.0"

sources:
  - id: "http_request"
    name: "HTTP Request"
    description: "HTTP request parameters from various frameworks and languages"
    patterns:
      - "request.args"
      - "request.form"
      - "request.GET"
      - "request.POST"
      - "req.body"
      - "req.query"
      - "req.params"
      - "$_GET"
      - "$_POST"
      - "$_REQUEST"
      - "getParameter"
      - "formData.get"
      - "formData.getAll"
      - "formData.entries"
      - "request.text"
      - "request.json"
      - "request.formData"
      - "cookies().get"
      - "headers().get"
      - "searchParams.get"
    languages: ["*"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

  - id: "cli_args"
    name: "Command Line Arguments"
    description: "CLI 参数：非远程攻击面，仅本地/运维可控，单独标记为低严重度 source"
    patterns:
      - "process.argv"
      - "sys.argv"
      - "os.Args"
      - "env::args"
    languages: ["*"]
    severity: "Low"
    category: "CliInput"
    ast_patterns: []

  - id: "file_input"
    name: "File Input"
    description: "Content read from files"
    patterns:
      - "readFile"
      - "read()"
      - "readlines"
      - "fs.read"
      - "f.read"
      - "File.read"
      - "std::fs::read"
    languages: ["*"]
    severity: "Medium"
    category: "FileInput"
    ast_patterns: []

  - id: "env_input"
    name: "Environment Variable"
    description: "Environment variables that may contain sensitive data"
    patterns:
      - "process.env"
      - "os.environ"
      - "System.getenv"
      - "std::env::var"
      - "getenv"
    languages: ["*"]
    severity: "Medium"
    category: "Environment"
    ast_patterns: []

sinks:
  - id: "sql_exec"
    name: "SQL Execution"
    description: "SQL query execution functions across languages and frameworks"
    match_mode: "Semantic"
    namespaces:
      - "mysql2"
      - "mysql"
      - "mariadb"
      - "pg"
      - "sqlite3"
      - "better-sqlite3"
      - "sequelize"
      - "sqlalchemy"
      - "peewee"
      - "django.db"
      - "pymysql"
      - "sqlite"
      - "java.sql"
      - "javax.sql"
      - "org.springframework.jdbc"
    receiver_patterns:
      - "connection"
      - "conn"
      - "pool"
      - "client"
      - "cursor"
      - "db"
      - "database"
      - "statement"
      - "stmt"
      - "jdbc"
      - "template"
    patterns:
      - ".query"
      - ".execute"
      - ".raw"
      - ".run"
      - ".all"
      - ".get"
      - ".exec"
    exact_matches:
      - "cursor.execute"
      - "cursor.executemany"
      - "db.execute"
      - "db.query"
      - "connection.query"
      - "connection.execute"
      - "pool.query"
      - "pool.execute"
      - "client.query"
      - "stmt.execute"
      - "statement.execute"
      - "jdbcTemplate.query"
      - "jdbcTemplate.execute"
    languages: ["*"]
    vulnerability_type: "SqlInjection"
    severity: "Critical"
    cwe_id: "CWE-89"
    sensitive_params: [0]
    ast_patterns: []

  - id: "cmd_exec"
    name: "Command Execution"
    description: "System command execution functions across languages"
    match_mode: "Semantic"
    namespaces:
      - "child_process"
      - "subprocess"
      - "os"
      - "java.lang.Runtime"
      - "java.lang.ProcessBuilder"
      - "ProcessBuilder"
      - "std::process"
    receiver_patterns:
      - "runtime"
      - "process"
      - "command"
    patterns:
      - ".exec"
      - ".spawn"
      - ".execFile"
      - ".execSync"
      - ".run"
      - ".system"
      - "Command::new"
      - "shell_exec"
      - "passthru"
      - "proc_open"
      - "popen"
    exact_matches:
      - "os.system"
      - "Runtime.exec"
      - "ProcessBuilder.command"
      - "child_process.exec"
      - "child_process.execSync"
      - "child_process.spawn"
      - "subprocess.run"
      - "subprocess.Popen"
      - "subprocess.call"
      - "std::process::Command::new"
    languages: ["*"]
    vulnerability_type: "CommandInjection"
    severity: "Critical"
    cwe_id: "CWE-78"
    sensitive_params: [0]
    ast_patterns: []

  - id: "file_path"
    name: "File Path"
    description: "File system operations with user-controlled paths"
    match_mode: "Substring"
    patterns:
      - "open("
      - "fopen"
      - "file_get_contents"
      - "file_put_contents"
      - "readFile"
      - "writeFile"
      - "fs.open"
      - "fs.readFile"
      - "fs.writeFile"
      - "sendFile"
      - "File("
      - "FileReader"
      - "FileWriter"
      - "std::fs::File"
      - "std::fs::read"
      - "std::fs::write"
    languages: ["*"]
    vulnerability_type: "PathTraversal"
    severity: "High"
    cwe_id: "CWE-22"
    sensitive_params: [0]
    ast_patterns: []

  - id: "html_output"
    name: "HTML Output"
    description: "Direct HTML output that may lead to XSS"
    match_mode: "Substring"
    patterns:
      - "innerHTML"
      - "document.write"
      - "dangerouslySetInnerHTML"
      - "res.write("
      - "res.send("
      - "Response.Write"
    languages: ["*"]
    vulnerability_type: "CrossSiteScripting"
    severity: "High"
    cwe_id: "CWE-79"
    sensitive_params: [0]
    ast_patterns: []

  - id: "http_request"
    name: "HTTP Request"
    description: "Outbound HTTP requests (SSRF risk)"
    match_mode: "Semantic"
    namespaces:
      - "axios"
      - "requests"
      - "urllib"
      - "urllib2"
      - "httpx"
      - "got"
      - "needle"
      - "superagent"
      - "node-fetch"
      - "reqwest"
      - "http"
      - "https"
      - "java.net"
      - "HttpClient"
      - "URL"
    receiver_patterns:
      - "client"
    patterns:
      - ".get"
      - ".post"
      - ".put"
      - ".delete"
      - ".patch"
      - ".request"
      - ".fetch"
    exact_matches:
      - "requests.get"
      - "requests.post"
      - "requests.put"
      - "requests.delete"
      - "urllib.request.urlopen"
      - "http.request"
      - "https.request"
    languages: ["*"]
    vulnerability_type: "ServerSideRequestForgery"
    severity: "High"
    cwe_id: "CWE-918"
    sensitive_params: [0]
    ast_patterns: []

  - id: "eval"
    name: "Code Evaluation"
    description: "Dynamic code evaluation functions"
    match_mode: "Substring"
    patterns:
      - "eval("
      - "new Function("
      - "Function("
      - "__import__"
      - "compile("
      - "vm.runInContext"
      - "vm.runInNewContext"
      - "vm.runInThisContext"
      - "vm.Script"
    languages: ["*"]
    vulnerability_type: "CodeInjection"
    severity: "Critical"
    cwe_id: "CWE-94"
    sensitive_params: [0]
    ast_patterns: []

  - id: "deserialization"
    name: "Unsafe Deserialization"
    description: "Insecure deserialization including React RSC Flight protocol"
    match_mode: "Semantic"
    namespaces:
      - "ObjectMapper"
      - "pickle"
      - "yaml"
      - "PyYAML"
      - "cPickle"
      - "marshal"
      - "serde_json"
    patterns:
      - ".parse"
      - ".readValue"
      - ".loads"
      - ".load"
      - ".unserialize"
      - ".deserialize"
    exact_matches:
      - "objectMapper.readValue"
      - "pickle.loads"
      - "pickle.load"
      - "yaml.load"
      - "yaml.unsafe_load"
      - "serde_json::from_str"
    languages: ["*"]
    vulnerability_type: "InsecureDeserialization"
    severity: "Critical"
    cwe_id: "CWE-502"
    sensitive_params: [0]
    ast_patterns: []

sanitizers:
  - pattern: "escape"
    description: "Generic escape function"
  - pattern: "sanitize"
    description: "Generic sanitize function"
  - pattern: "htmlspecialchars"
    description: "PHP HTML entity encoding"
  - pattern: "htmlentities"
    description: "PHP HTML entity encoding (extended)"
  - pattern: "encode"
    description: "Encoding function"
  - pattern: "encodeURI"
    description: "JavaScript URI encoding"
  - pattern: "encodeURIComponent"
    description: "JavaScript URI component encoding"
  - pattern: "escapeHtml"
    description: "HTML escape helper"
  - pattern: "escapeHtmlAttr"
    description: "HTML attribute escape"
  - pattern: "DOMPurify"
    description: "DOMPurify XSS sanitizer"
  - pattern: "xss"
    description: "XSS filter library"
  - pattern: "bleach"
    description: "Python HTML sanitizer (bleach)"
  - pattern: "markupsafe"
    description: "Python MarkupSafe escape"
  - pattern: "validate"
    description: "Validation function"
  - pattern: "whitelist"
    description: "Whitelist-based validation"
  - pattern: "allowlist"
    description: "Allowlist-based validation"
  - pattern: "bind_param"
    description: "MySQLi prepared statement parameter binding"
  - pattern: "bindParam"
    description: "PDO prepared statement parameter binding"
  - pattern: "addSlashes"
    description: "SQL string escaping"
  - pattern: "real_escape_string"
    description: "MySQL real escape string"
  - pattern: "escape_string"
    description: "Generic string escaping"
  - pattern: "StringEscapeUtils"
    description: "Apache Commons string escaping"
  - pattern: "ESAPI"
    description: "OWASP ESAPI encoder"
  - pattern: "urldecode"
    description: "URL decoding (sanitizes encoded input)"
  - pattern: "parseInt"
    description: "Integer parsing (type coercion sanitization)"
  - pattern: "Number"
    description: "Number coercion (type sanitization)"
  - pattern: "parseInt"
    description: "Integer parsing (type coercion)"
  - pattern: "int("
    description: "Integer casting (type coercion)"
  - pattern: "float("
    description: "Float casting (type coercion)"
