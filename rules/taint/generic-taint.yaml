kind: taint-rules
name: "Generic Taint Rules"
version: "1.0"

sources:
  - id: "http_request"
    name: "HTTP Request"
    description: "HTTP request parameters from various frameworks and languages"
    patterns:
      - "request.args"
      - "request.form"
      - "request.GET"
      - "request.POST"
      - "req.body"
      - "req.query"
      - "req.params"
      - "$_GET"
      - "$_POST"
      - "$_REQUEST"
      - "getParameter"
      - "formData.get"
      - "formData.getAll"
      - "formData.entries"
      - "request.text"
      - "request.json"
      - "request.formData"
      # 08.01 补充（R61 CVE-2024-52004 回放）：Django 上传文件、
      # DRF 请求体与原始 body 同为远程可控输入
      - "request.FILES"
      - "request.data"
      - "request.body"
      - "cookies().get"
      - "headers().get"
      - "searchParams.get"
    languages: ["*"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

  - id: "cli_args"
    name: "Command Line Arguments"
    description: "CLI 参数：非远程攻击面，仅本地/运维可控，单独标记为低严重度 source"
    patterns:
      - "process.argv"
      - "sys.argv"
      - "os.Args"
      - "env::args"
    languages: ["*"]
    severity: "Low"
    category: "CliInput"
    ast_patterns: []

  - id: "file_input"
    name: "File Input"
    description: "Content read from files"
    patterns:
      - "readFile"
      - "read()"
      - "readlines"
      - "fs.read"
      - "f.read"
      - "File.read"
      - "std::fs::read"
    languages: ["*"]
    severity: "Medium"
    category: "FileInput"
    ast_patterns: []

  - id: "env_input"
    name: "Environment Variable"
    description: "Environment variables that may contain sensitive data"
    patterns:
      - "process.env"
      - "os.environ"
      - "System.getenv"
      - "std::env::var"
      - "getenv"
    languages: ["*"]
    # 10.15③（R36 登记）：env 是部署者配置（威胁模型外），不构成
    # 硬编码凭证/命令注入/路径遍历的用户可控污点源——保留为 Low 参考级
    severity: "Low"
    category: "Environment"
    ast_patterns: []

  - id: "template_render_output"
    name: "Template Render Output"
    description: "Jinja2/Django 模板渲染输出（template.render / env.from_string / render_template_string）。输出内容含模板上下文（可含用户数据），用作文件路径/命令等 sink 时构成路径遍历（10.16，R42 GHSA-28cf 回放）。仅作文件路径类 sink 的 source，流经 HTML 响应输出场景由判定层排除。"
    patterns:
      - "template.render"
      - "env.from_string"
      - "render_template_string"
    languages: ["python"]
    severity: "Medium"
    category: "TemplateRender"
    ast_patterns: []

  - id: "http_response_headers"
    name: "HTTP Response Headers"
    description: "上游响应头（axios/fetch/requests 的 response.headers / res.headers）。响应头内容受上游服务器/中间人控制（如 ETag、Content-Disposition、Location），用作文件名/路径/SSRF 目标时构成攻击面（R89 GHSA-mc6w-69r3-62h8 回放：上游 ETag → 缓存文件名 → 路径穿越 RCE）。"
    patterns:
      - "response.headers"
      - "res.headers"
      - "resp.headers"
    languages: ["javascript", "typescript", "python"]
    severity: "Medium"
    category: "UserInput"
    ast_patterns: []

sinks:
  - id: "sql_exec"
    name: "SQL Execution"
    description: "SQL query execution functions across languages and frameworks"
    match_mode: "Semantic"
    namespaces:
      - "mysql2"
      - "mysql"
      - "mariadb"
      - "pg"
      - "sqlite3"
      - "better-sqlite3"
      - "sequelize"
      - "sqlalchemy"
      - "peewee"
      - "django.db"
      - "pymysql"
      - "sqlite"
      - "java.sql"
      - "javax.sql"
      - "org.springframework.jdbc"
    receiver_patterns:
      - "connection"
      - "conn"
      - "pool"
      - "client"
      - "cursor"
      - "cur"
      - "cnn"
      - "db"
      - "database"
      - "statement"
      - "stmt"
      - "jdbc"
      - "template"
    # 注：`.get`/`.all` 已移除——Java 生态中 `client.get(...)`/`session.get(...)`
    # 是存储/ORM 读取而非 SQL 执行（WebFlux FP 家族）；
    # node sqlite3/better-sqlite3 的 `db.get`/`db.all` 由下方 exact_matches 补偿。
    # class_literal_exempt：参数含 `Type.class` 的调用是仓库/类型注册查找，不匹配。
    class_literal_exempt: true
    patterns:
      - ".query"
      - ".execute"
      - ".raw"
      - ".run"
      - ".exec"
    exact_matches:
      - "cursor.execute"
      - "cursor.executemany"
      - "db.execute"
      - "db.query"
      - "db.get"
      - "db.all"
      - "connection.query"
      - "connection.execute"
      - "pool.query"
      - "pool.execute"
      - "client.query"
      - "stmt.execute"
      - "statement.execute"
      - "jdbcTemplate.query"
      - "jdbcTemplate.execute"
    languages: ["*"]
    vulnerability_type: "SqlInjection"
    severity: "Critical"
    cwe_id: "CWE-89"
    sensitive_params: [0]
    ast_patterns: []

  - id: "cmd_exec"
    name: "Command Execution"
    description: "System command execution functions across languages"
    match_mode: "Semantic"
    namespaces:
      - "child_process"
      - "subprocess"
      - "os"
      - "java.lang.Runtime"
      - "java.lang.ProcessBuilder"
      - "ProcessBuilder"
      - "std::process"
    receiver_patterns:
      - "runtime"
      - "process"
      - "command"
    patterns:
      - ".exec"
      - ".spawn"
      - ".execFile"
      - ".execSync"
      - ".run"
      - ".system"
      - "Command::new"
      - "shell_exec"
      - "passthru"
      - "proc_open"
      - "popen"
    exact_matches:
      - "os.system"
      - "Runtime.exec"
      - "ProcessBuilder.command"
      - "child_process.exec"
      - "child_process.execSync"
      - "child_process.spawn"
      - "subprocess.run"
      - "subprocess.Popen"
      - "subprocess.call"
      - "std::process::Command::new"
    languages: ["*"]
    vulnerability_type: "CommandInjection"
    severity: "Critical"
    cwe_id: "CWE-78"
    sensitive_params: [0]
    ast_patterns: []

  - id: "file_path"
    name: "File Path"
    description: "File system operations with user-controlled paths"
    match_mode: "Substring"
    patterns:
      - "open("
      - "fopen"
      - "file_get_contents"
      - "file_put_contents"
      - "readFile"
      - "writeFile"
      - "fs.open"
      - "fs.readFile"
      - "fs.writeFile"
      - "sendFile"
      - "File("
      - "FileReader"
      - "FileWriter"
      # 10.16 扩展（R51）：Python pathlib `Path(x)` 构造即路径操作
      # （GHSA-28cf 链：template.render → Path(rendered_path)）
      - "Path("
      - "std::fs::File"
      - "std::fs::read"
      - "std::fs::write"
      # 08.01 补充（R61 CVE-2024-52004 回放）：Python 文件删除/移动/复制
      # 操作同样是路径遍历 sink——该 CVE 正是 shutil.rmtree(用户可控路径)
      # 导致任意目录删除。不含 `.save(`（会误命中全部 ORM save）。
      - "shutil.rmtree"
      - "shutil.move("
      - "shutil.copy"
      - "os.remove("
      - "os.unlink("
      - "os.rename("
    languages: ["*"]
    vulnerability_type: "PathTraversal"
    severity: "High"
    cwe_id: "CWE-22"
    sensitive_params: [0]
    ast_patterns: []

  - id: "html_output"
    name: "HTML Output"
    description: "Direct HTML output that may lead to XSS"
    match_mode: "Substring"
    patterns:
      - "innerHTML"
      - "document.write"
      - "dangerouslySetInnerHTML"
      - "res.write("
      - "res.send("
      - "Response.Write"
    languages: ["*"]
    vulnerability_type: "CrossSiteScripting"
    severity: "High"
    cwe_id: "CWE-79"
    sensitive_params: [0]
    ast_patterns: []

  - id: "http_request"
    name: "HTTP Request"
    description: "Outbound HTTP requests (SSRF risk)"
    match_mode: "Semantic"
    namespaces:
      - "axios"
      - "requests"
      - "urllib"
      - "urllib2"
      - "httpx"
      - "got"
      - "needle"
      - "superagent"
      - "node-fetch"
      - "reqwest"
      - "http"
      - "https"
      - "java.net"
      - "HttpClient"
      - "URL"
    receiver_patterns:
      - "client"
    # 注：`.fetch` 已移除——Java 生态 `fetch` 是存储/JPA 语义（ReactiveExtensionClient、
    # Spring Data），并非 HTTP 动词（WebFlux FP 家族）；JS 全局 `fetch(` 本就不
    # 经 receiver 语义命中（由 express-node 字典的 `fetch(` 覆盖）。
    # class_literal_exempt：参数含 `Type.class` 的调用是仓库/类型注册查找，不匹配。
    class_literal_exempt: true
    patterns:
      - ".get"
      - ".post"
      - ".put"
      - ".delete"
      - ".patch"
      - ".request"
    exact_matches:
      - "requests.get"
      - "requests.post"
      - "requests.put"
      - "requests.delete"
      - "urllib.request.urlopen"
      - "http.request"
      - "https.request"
    languages: ["*"]
    vulnerability_type: "ServerSideRequestForgery"
    severity: "High"
    cwe_id: "CWE-918"
    sensitive_params: [0]
    ast_patterns: []

  - id: "eval"
    name: "Code Evaluation"
    description: "Dynamic code evaluation functions"
    match_mode: "Substring"
    patterns:
      - "eval("
      - "new Function("
      - "Function("
      - "__import__"
      - "vm.runInContext"
      - "vm.runInNewContext"
      - "vm.runInThisContext"
      - "vm.Script"
    languages: ["*"]
    vulnerability_type: "CodeInjection"
    severity: "Critical"
    cwe_id: "CWE-94"
    sensitive_params: [0]
    ast_patterns: []

  - id: "deserialization"
    name: "Unsafe Deserialization"
    description: "Insecure deserialization including React RSC Flight protocol"
    match_mode: "Semantic"
    namespaces:
      - "ObjectMapper"
      - "pickle"
      - "yaml"
      - "PyYAML"
      - "cPickle"
      - "marshal"
      # 移除 serde_json：数据专用反序列化器，无 gadget 链，非 CWE-502（误标修复）
    patterns:
      - ".parse"
      - ".readValue"
      - ".loads"
      - ".load"
      - ".unserialize"
      - ".deserialize"
    exact_matches:
      - "objectMapper.readValue"
      - "pickle.loads"
      - "pickle.load"
      - "yaml.load"
      - "yaml.unsafe_load"
      # 移除 serde_json::from_str：同上
    languages: ["*"]
    vulnerability_type: "InsecureDeserialization"
    severity: "Critical"
    cwe_id: "CWE-502"
    sensitive_params: [0]
    ast_patterns: []

sanitizers:
  - pattern: "escape"
    description: "Generic escape function"
  - pattern: "sanitize"
    description: "Generic sanitize function"
  - pattern: "htmlspecialchars"
    description: "PHP HTML entity encoding"
  - pattern: "htmlentities"
    description: "PHP HTML entity encoding (extended)"
  - pattern: "encode"
    description: "Encoding function"
  - pattern: "encodeURI"
    description: "JavaScript URI encoding"
  - pattern: "encodeURIComponent"
    description: "JavaScript URI component encoding"
  - pattern: "escapeHtml"
    description: "HTML escape helper"
  - pattern: "escapeHtmlAttr"
    description: "HTML attribute escape"
  - pattern: "DOMPurify"
    description: "DOMPurify XSS sanitizer"
  - pattern: "xss"
    description: "XSS filter library"
  - pattern: "bleach"
    description: "Python HTML sanitizer (bleach)"
  - pattern: "markupsafe"
    description: "Python MarkupSafe escape"
  - pattern: "validate"
    description: "Validation function"
  - pattern: "whitelist"
    description: "Whitelist-based validation"
  - pattern: "allowlist"
    description: "Allowlist-based validation"
  - pattern: "bind_param"
    description: "MySQLi prepared statement parameter binding"
  - pattern: "bindParam"
    description: "PDO prepared statement parameter binding"
  - pattern: "addSlashes"
    description: "SQL string escaping"
  - pattern: "real_escape_string"
    description: "MySQL real escape string"
  - pattern: "escape_string"
    description: "Generic string escaping"
  - pattern: "StringEscapeUtils"
    description: "Apache Commons string escaping"
  - pattern: "ESAPI"
    description: "OWASP ESAPI encoder"
  - pattern: "urldecode"
    description: "URL decoding (sanitizes encoded input)"
  - pattern: "parseInt"
    description: "Integer parsing (type coercion sanitization)"
  - pattern: "Number"
    description: "Number coercion (type sanitization)"
  - pattern: "parseInt"
    description: "Integer parsing (type coercion)"
  - pattern: "int("
    description: "Integer casting (type coercion)"
  - pattern: "float("
    description: "Float casting (type coercion)"
  - pattern: "filter_by"
    description: "SQLAlchemy ORM filter_by (parameterized query)"
  - pattern: "filter("
    description: "SQLAlchemy ORM filter (parameterized query)"
  - pattern: ".where("
    description: "SQLAlchemy/Query builder where clause (parameterized)"
  - pattern: "select("
    description: "SQLAlchemy select construct (parameterized)"
  - pattern: "literal_eval"
    description: "Python ast.literal_eval (safe literal parser, not eval)"
  - pattern: "escapeshellarg"
    description: "PHP shell argument escaping"
  - pattern: "escapeshellcmd"
    description: "PHP shell command escaping"
  - pattern: "shlex.quote"
    description: "Python shell quoting"
  - pattern: "filepath.Base"
    description: "Go filepath.Base (strips directory components)"
  - pattern: "path.Base"
    description: "Go path.Base (strips directory components)"
  - pattern: "ValidateNameComponent"
    description: "Filename validation (strips path traversal)"
  - pattern: "[^\\w-]"
    description: "JS 字符集白名单清洗（replace(/[^\\w-]/g, '') 形态，R89 GHSA-mc6w-69r3-62h8 修复形态：ETag 清洗仅留 word/dash 字符，路径穿越序列被剥除）"
