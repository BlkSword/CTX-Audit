kind: taint-rules
name: "Express / Node.js Taint Rules"
version: "1.0"

sources:
  - id: "express_request_body"
    name: "Express Request Body"
    description: "HTTP request body, query, and parameters"
    patterns:
      - "req.body"
      - "req.query"
      - "req.params"
      - "req.headers"
      - "req.cookies"
      - "req.get("
      - "req.header("
      - "req.param("
      # R136 swetrix 回放反哺：Remix/React-Router loader/action 的 request 对象
      # （request.formData()/request.text()/request.json()/request.url）——
      # 此前 JS taint 源只覆盖 Express req.*，裸 fetch(userVar) 0 命中
      - "request.formData()"
      - "request.text()"
      - "request.json()"
      - "request.url"
    languages: ["javascript", "typescript"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

  - id: "node_process_input"
    name: "Node.js Process Input"
    description: "Command-line arguments and environment variables"
    patterns:
      - "process.argv"
      - "process.env"
      - "process.stdin"
    languages: ["javascript", "typescript"]
    severity: "Medium"
    category: "UserInput"
    ast_patterns: []

  - id: "node_file_input"
    name: "Node.js File Input"
    description: "File system read operations"
    patterns:
      - "fs.readFile"
      - "fs.readFileSync"
      - "fs.read"
      - "createReadStream"
    languages: ["javascript", "typescript"]
    severity: "Medium"
    category: "FileInput"
    ast_patterns: []

  - id: "socketio_event_input"
    name: "Socket.io / WebSocket Event Input"
    description: "User data from WebSocket/socket.io event handlers — callback parameters are attacker-controlled"
    patterns:
      - "socket.on("
      - "socket.once("
      - "io.on("
      - "io.sockets.on("
      - "ws.on("
      - "ws.once("
      - ".on('message'"
      - ".on(\"message\""
    languages: ["javascript", "typescript"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

sinks:
  - id: "node_eval"
    name: "Node.js eval"
    description: "Dynamic code evaluation"
    match_mode: "Semantic"
    namespaces:
      - "vm"
    patterns:
      - "eval("
      - "new Function("
      - "Function("
      - ".runInContext"
      - ".runInNewContext"
      - ".runInThisContext"
      - ".compileFunction"
      - ".Script"
    exact_matches:
      - "vm.runInContext"
      - "vm.runInNewContext"
      - "vm.runInThisContext"
      - "vm.compileFunction"
      - "vm.Script"
    languages: ["javascript", "typescript"]
    vulnerability_type: "CodeInjection"
    severity: "Critical"
    cwe_id: "CWE-94"
    sensitive_params: [0]
    ast_patterns: []

  - id: "node_child_process"
    name: "Node.js Child Process"
    description: "System command execution via child_process"
    match_mode: "Semantic"
    namespaces:
      - "child_process"
    receiver_patterns:
      - "child_process"
    patterns:
      - ".exec"
      - ".execSync"
      - ".spawn"
      - ".execFile"
      - ".fork"
      - "exec("
      - "execSync("
      - "spawn("
    exact_matches:
      - "child_process.exec"
      - "child_process.execSync"
      - "child_process.spawn"
      - "child_process.execFile"
      - "child_process.fork"
      # 支持 const { exec } = require('child_process'); exec(...) 的解构用法
      - "exec"
      - "execSync"
      - "spawn"
      - "execFile"
      - "fork"
    languages: ["javascript", "typescript"]
    vulnerability_type: "CommandInjection"
    severity: "Critical"
    cwe_id: "CWE-78"
    sensitive_params: [0]
    ast_patterns: []

  - id: "node_html_output"
    name: "Node.js HTML Response"
    description: "Direct HTML output without escaping"
    match_mode: "Substring"
    patterns:
      - "res.send("
      - "res.write("
      - "res.end("
      - "response.write("
      - "innerHTML"
    languages: ["javascript", "typescript"]
    vulnerability_type: "CrossSiteScripting"
    severity: "High"
    cwe_id: "CWE-79"
    sensitive_params: [0]
    ast_patterns: []

  - id: "node_file_write"
    name: "Node.js File Write"
    description: "File write with user-controlled paths or content"
    match_mode: "Semantic"
    namespaces:
      - "fs"
    patterns:
      - ".writeFile"
      - ".writeFileSync"
      - ".appendFile"
      - ".createWriteStream"
      - ".open"
      - ".readFile"
      - ".sendFile"
    exact_matches:
      - "fs.writeFile"
      - "fs.writeFileSync"
      - "fs.appendFile"
      - "fs.createWriteStream"
      - "fs.open"
      - "res.sendFile"
    languages: ["javascript", "typescript"]
    vulnerability_type: "PathTraversal"
    severity: "High"
    cwe_id: "CWE-22"
    sensitive_params: [0]
    ast_patterns: []

  - id: "node_http_request"
    name: "Node.js HTTP Request (SSRF)"
    description: "Outbound HTTP requests with user-controlled URLs"
    match_mode: "Semantic"
    namespaces:
      - "http"
      - "https"
      - "axios"
      - "got"
      - "needle"
      - "superagent"
      - "node-fetch"
      - "urllib"
      - "request"
      - "request-promise"
    patterns:
      - ".get"
      - ".post"
      - ".put"
      - ".delete"
      - ".request"
      - "fetch("
    exact_matches:
      - "http.request"
      - "https.request"
      - "axios.get"
      - "axios.post"
      - "needle.get"
      - "needle.post"
      - "got("
      - "superagent.get"
      - "fetch("
    languages: ["javascript", "typescript"]
    vulnerability_type: "ServerSideRequestForgery"
    severity: "High"
    cwe_id: "CWE-918"
    sensitive_params: [0]
    ast_patterns: []

  - id: "node_mongodb_query"
    name: "MongoDB Query (NoSQL Injection)"
    description: "MongoDB operations with user-controlled query objects"
    match_mode: "Semantic"
    receiver_patterns:
      - "collection"
      - "db"
    patterns:
      - ".find"
      - ".findOne"
      - ".update"
      - ".updateOne"
      - ".updateMany"
      - ".remove"
      - ".deleteOne"
      - ".deleteMany"
      - ".aggregate"
      - "$where"
    exact_matches:
      - "collection.find"
      - "collection.findOne"
      - "collection.update"
      - "collection.updateOne"
      - "collection.aggregate"
      - "db.collection"
    languages: ["javascript", "typescript"]
    vulnerability_type: "NoSqlInjection"
    severity: "High"
    cwe_id: "CWE-89"
    sensitive_params: [0]
    ast_patterns: []

sanitizers:
  - pattern: "encodeURIComponent"
    description: "URI component encoding"
  - pattern: "validator.escape"
    description: "validator.js HTML escape"
  - pattern: "DOMPurify.sanitize"
    description: "DOMPurify HTML sanitizer"
  - pattern: "sanitize-html"
    description: "sanitize-html library"
  - pattern: "escapeHtml"
    description: "HTML entity escaping"
  - pattern: "mongo-sanitize"
    description: "MongoDB query sanitizer"
  - pattern: "express-mongo-sanitize"
    description: "Express MongoDB sanitizer middleware"
