kind: taint-rules
name: "Java Taint Rules"
version: "1.0"

sources:
  - id: "java_http_request"
    name: "Java HTTP Request"
    description: "Servlet/Jakarta request parameters and headers"
    patterns:
      - "request.getParameter"
      - "request.getParameterValues"
      - "request.getParameterMap"
      - "request.getParameterNames"
      - "request.getHeader"
      - "request.getHeaders"
      - "request.getQueryString"
      - "request.getCookies"
      - "request.getInputStream"
      - "request.getReader"
      - "request.getRemoteUser"
      - "request.getServletPath"
      - "request.getPathInfo"
      - "request.getRequestURI"
      - "req.getParameter"
      - "req.getHeader"
      - "HttpServletRequest"
      - "ServletRequest"
    languages: ["java"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

  - id: "java_command_args"
    name: "Java Command-Line Arguments"
    description: "Main method arguments and system properties"
    patterns:
      - "args["
      - "System.getProperty"
      - "System.getenv"
    languages: ["java"]
    severity: "Medium"
    category: "UserInput"
    ast_patterns: []

  - id: "java_file_input"
    name: "Java File Input"
    description: "Data read from files or streams"
    patterns:
      - "Files.readString"
      - "Files.readAllBytes"
      - "Files.readAllLines"
      - "FileInputStream"
      - "FileReader"
      - "BufferedReader.readLine"
      - "Scanner.next"
      - "Scanner.nextLine"
    languages: ["java"]
    severity: "Medium"
    category: "FileInput"
    ast_patterns: []

sinks:
  - id: "java_sql_exec"
    name: "Java SQL Execution"
    description: "SQL execution via JDBC, MyBatis, JPA, and Spring JDBC"
    match_mode: "Semantic"
    namespaces:
      - "java.sql"
      - "javax.sql"
      - "org.springframework.jdbc"
      - "org.apache.ibatis"
      - "jakarta.persistence"
      - "javax.persistence"
    receiver_patterns:
      - "statement"
      - "stmt"
      - "connection"
      - "conn"
      - "template"
      - "mapper"
      - "query"
      - "session"
    patterns:
      - ".executeQuery"
      - ".execute"
      - ".executeUpdate"
      - ".executeBatch"
      - ".prepareStatement"
      - ".prepareCall"
      - ".query"
      - ".selectOne"
      - ".selectList"
      - ".update"
    exact_matches:
      - "Statement.executeQuery"
      - "Statement.execute"
      - "Statement.executeUpdate"
      - "Statement.executeBatch"
      - "PreparedStatement.executeQuery"
      - "Connection.createStatement().executeQuery"
      - "jdbcTemplate.query"
      - "jdbcTemplate.execute"
    languages: ["java"]
    vulnerability_type: "SqlInjection"
    severity: "Critical"
    cwe_id: "CWE-89"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_cmd_exec"
    name: "Java Command Execution"
    description: "OS command execution via Runtime, ProcessBuilder, and shell helpers"
    match_mode: "Semantic"
    namespaces:
      - "java.lang.Runtime"
      - "java.lang.ProcessBuilder"
      - "Runtime"
      - "ProcessBuilder"
    receiver_patterns:
      - "runtime"
      - "process"
      - "builder"
      - "getruntime"
    patterns:
      - ".exec"
      - ".command"
      - ".start"
      - ".inheritIO"
      - "ProcessBuilder"
      - "Runtime.getRuntime"
    exact_matches:
      - "Runtime.exec"
      - "Runtime.getRuntime().exec"
      - "getRuntime().exec"
      - "ProcessBuilder.command"
      - "ProcessBuilder.start"
      - "ProcessBuilder.inheritIO"
      - "ProcessBuilder.directory"
    languages: ["java"]
    vulnerability_type: "CommandInjection"
    severity: "Critical"
    cwe_id: "CWE-78"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_ssrf"
    name: "Java SSRF"
    description: "Outbound URL connections and HTTP clients"
    match_mode: "Semantic"
    namespaces:
      - "java.net"
      - "java.net.http"
      - "org.apache.http"
      - "okhttp3"
      - "feign"
      - "org.springframework.web.client"
    receiver_patterns:
      - "url"
      - "client"
      - "connection"
      - "request"
    patterns:
      - ".openConnection"
      - ".openStream"
      - ".getInputStream"
      - ".send"
      - ".execute"
      - ".newCall"
    exact_matches:
      - "URL.openConnection"
      - "HttpClient.send"
      - "HttpURLConnection.getInputStream"
      - "RestTemplate.getForObject"
      - "RestTemplate.postForObject"
      - "OkHttpClient.newCall"
    languages: ["java"]
    vulnerability_type: "ServerSideRequestForgery"
    severity: "High"
    cwe_id: "CWE-918"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_deserialization"
    name: "Java Unsafe Deserialization"
    description: "ObjectInputStream, ObjectMapper, and XMLDecoder deserialization"
    match_mode: "Semantic"
    namespaces:
      - "java.io.ObjectInputStream"
      - "com.fasterxml.jackson.databind"
      - "java.beans.XMLDecoder"
      - "org.apache.commons.collections"
      - "XStream"
    receiver_patterns:
      - "objectInputStream"
      - "objectMapper"
      - "xmlDecoder"
      - "xstream"
    patterns:
      - ".readObject"
      - ".readValue"
      - ".read"
      - ".fromXML"
    exact_matches:
      - "ObjectInputStream.readObject"
      - "ObjectMapper.readValue"
      - "XMLDecoder.readObject"
      - "XStream.fromXML"
    languages: ["java"]
    vulnerability_type: "InsecureDeserialization"
    severity: "Critical"
    cwe_id: "CWE-502"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_file_path"
    name: "Java File Path"
    description: "File system and ZIP operations with user-controlled paths"
    match_mode: "Semantic"
    namespaces:
      - "java.io"
      - "java.nio.file"
      - "java.util.zip"
      - "java.nio.file.spi"
    receiver_patterns:
      - "file"
      - "files"
      - "path"
      - "paths"
      - "inputstream"
      - "outputstream"
      - "reader"
      - "writer"
      - "zip"
      - "zipEntry"
    patterns:
      - "File"
      - "FileInputStream"
      - "FileOutputStream"
      - "FileReader"
      - "FileWriter"
      - ".readString"
      - ".write"
      - ".copy"
      - ".move"
      - ".delete"
      - ".newInputStream"
      - ".newOutputStream"
      - ".newBufferedReader"
      - ".newBufferedWriter"
      - ".resolve"
      - ".resolveSibling"
      - ".normalize"
      - ".toRealPath"
      - "ZipInputStream"
      - "ZipEntry"
    exact_matches:
      - "File"
      - "FileInputStream"
      - "FileOutputStream"
      - "FileReader"
      - "FileWriter"
      - "Files.readString"
      - "Files.write"
      - "Files.copy"
      - "Files.move"
      - "Files.delete"
      - "Paths.get"
      - "Path.resolve"
      - "FileSystems.newFileSystem"
    languages: ["java"]
    vulnerability_type: "PathTraversal"
    severity: "High"
    cwe_id: "CWE-22"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_el_injection"
    name: "Java Expression Language Injection"
    description: "EL and SpEL expression evaluation"
    match_mode: "Semantic"
    namespaces:
      - "javax.el"
      - "jakarta.el"
      - "org.springframework.expression"
    patterns:
      - ".createValueExpression"
      - ".getValue"
      - ".setValue"
      - ".parseExpression"
      - ".evaluate"
    exact_matches:
      - "ExpressionFactory.createValueExpression"
      - "ValueExpression.getValue"
      - "SpelExpressionParser.parseExpression"
    languages: ["java"]
    vulnerability_type: "CodeInjection"
    severity: "Critical"
    cwe_id: "CWE-917"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_ldap"
    name: "Java LDAP Injection"
    description: "LDAP search, lookup, and modification with user-controlled filters"
    match_mode: "Semantic"
    namespaces:
      - "javax.naming.directory"
      - "javax.naming.ldap"
      - "org.springframework.ldap"
      - "org.springframework.ldap.core"
    receiver_patterns:
      - "ctx"
      - "context"
      - "ldapTemplate"
      - "dirContext"
      - "initialDirContext"
    patterns:
      - ".search"
      - ".lookup"
      - ".bind"
      - ".rebind"
      - ".unbind"
      - ".modifyAttributes"
    exact_matches:
      - "DirContext.search"
      - "InitialDirContext.search"
      - "LdapTemplate.search"
      - "LdapTemplate.find"
      - "LdapTemplate.authenticate"
      - "LdapTemplate.bind"
    languages: ["java"]
    vulnerability_type: "LdapInjection"
    severity: "High"
    cwe_id: "CWE-90"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_xss_output"
    name: "Java XSS Output"
    description: "Writing user-controlled data to HTTP response, JSP, or template output"
    match_mode: "Semantic"
    receiver_patterns:
      - "response"
      - "writer"
      - "getwriter"
      - "out"
      - "outputstream"
      - "jstl"
      - "model"
      - "attributes"
    patterns:
      - ".print"
      - ".println"
      - ".write"
      - ".addAttribute"
      - "out.print"
      - "out.println"
      - "out.write"
    exact_matches:
      - "PrintWriter.println"
      - "PrintWriter.print"
      - "PrintWriter.write"
      - "getWriter().println"
      - "getWriter().print"
      - "getWriter().write"
      - "ServletOutputStream.write"
      - "Model.addAttribute"
      - "ModelMap.addAttribute"
    languages: ["java"]
    vulnerability_type: "CrossSiteScripting"
    severity: "High"
    cwe_id: "CWE-79"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_xpath"
    name: "Java XPath Injection"
    description: "XPath evaluation with user-controlled expressions"
    match_mode: "Semantic"
    namespaces:
      - "javax.xml.xpath"
      - "org.apache.commons.jxpath"
    receiver_patterns:
      - "xpath"
      - "xpathFactory"
      - "jxpathContext"
    patterns:
      - ".evaluate"
      - ".compile"
      - ".prepare"
      - ".getValue"
      - ".selectSingleNode"
    exact_matches:
      - "XPath.evaluate"
      - "XPath.compile"
      - "JXPathContext.getValue"
      - "JXPathContext.selectNodes"
    languages: ["java"]
    vulnerability_type: "XPathInjection"
    severity: "High"
    cwe_id: "CWE-643"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_weak_hash"
    name: "Java Weak Hash"
    description: "Use of broken hash algorithms for security-sensitive operations"
    match_mode: "Semantic"
    namespaces:
      - "java.security"
      - "javax.crypto"
      - "org.apache.commons.codec.digest"
    receiver_patterns:
      - "messageDigest"
      - "digestUtils"
      - "md"
      - "sha"
    patterns:
      - ".getInstance"
      - ".md5"
      - ".sha1"
      - ".sha"
      - ".md5Hex"
      - ".sha1Hex"
    exact_matches:
      - "MessageDigest.getInstance"
      - "DigestUtils.md5"
      - "DigestUtils.md5Hex"
      - "DigestUtils.sha1"
      - "DigestUtils.sha1Hex"
    languages: ["java"]
    vulnerability_type: "WeakHashAlgorithm"
    severity: "High"
    cwe_id: "CWE-328"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_insecure_cookie"
    name: "Java Insecure Cookie"
    description: "Cookie created without Secure/HttpOnly/SameSite flags"
    match_mode: "Semantic"
    namespaces:
      - "javax.servlet.http"
      - "jakarta.servlet.http"
      - "org.springframework.http"
    receiver_patterns:
      - "response"
      - "cookie"
      - "responseCookie"
    patterns:
      - ".addCookie"
      - "ResponseCookie.from"
      - "Cookie"
      - ".setSecure"
      - ".setHttpOnly"
      - ".setSameSite"
    exact_matches:
      - "HttpServletResponse.addCookie"
      - "ResponseCookie.from"
      - "Cookie.setSecure"
      - "Cookie.setHttpOnly"
      - "Cookie.setSameSite"
    languages: ["java"]
    vulnerability_type: "InsecureCookie"
    severity: "Medium"
    cwe_id: "CWE-614"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_trust_boundary"
    name: "Java Trust Boundary Violation"
    description: "User input stored directly in session without validation"
    match_mode: "Semantic"
    namespaces:
      - "javax.servlet.http"
      - "jakarta.servlet.http"
      - "org.springframework.web.context.request"
    receiver_patterns:
      - "session"
      - "httpSession"
    patterns:
      - ".setAttribute"
      - ".putValue"
    exact_matches:
      - "HttpSession.setAttribute"
      - "HttpSession.putValue"
    languages: ["java"]
    vulnerability_type: "TrustBoundaryViolation"
    severity: "Medium"
    cwe_id: "CWE-501"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_spel_injection"
    name: "Java SpEL / Expression Language Injection"
    description: "Spring Expression Language (SpEL) and script engine evaluation — Substring mode catches all without namespace restriction"
    match_mode: "Substring"
    patterns:
      - "SpelExpressionParser"
      - "parseExpression"
      - "ExpressionParser"
      - ".getValue"
      - "StandardEvaluationContext"
      - "SimpleEvaluationContext"
      - "TemplateParserContext"
    exact_matches:
      - "SpelExpressionParser.parseExpression"
      - "parseExpression"
      - "ScriptEngine.eval"
      - "ScriptEngine.evaluate"
    languages: ["java"]
    vulnerability_type: "CodeInjection"
    severity: "Critical"
    cwe_id: "CWE-94"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_ognl_injection"
    name: "Java OGNL Expression Injection"
    description: "OGNL expression evaluation — Struts, Tapestry, and general OGNL usage"
    match_mode: "Substring"
    patterns:
      - "Ognl.getValue"
      - "Ognl.setValue"
      - "Ognl.parseExpression"
      - "OgnlContext"
    exact_matches:
      - "Ognl.getValue"
      - "Ognl.setValue"
      - "Ognl.parseExpression"
    languages: ["java"]
    vulnerability_type: "CodeInjection"
    severity: "Critical"
    cwe_id: "CWE-94"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_mvel_injection"
    name: "Java MVEL Expression Injection"
    description: "MVEL expression evaluation — Drools, jBPM, and general MVEL usage"
    match_mode: "Substring"
    patterns:
      - "MVEL.eval"
      - "MVEL.executeExpression"
      - "MVEL.compileExpression"
    exact_matches:
      - "MVEL.eval"
      - "MVEL.executeExpression"
    languages: ["java"]
    vulnerability_type: "CodeInjection"
    severity: "Critical"
    cwe_id: "CWE-94"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_template_injection"
    name: "Java Template Engine SSTI"
    description: "Template engines processing user-controlled input — FreeMarker, Thymeleaf, Velocity, Pebble"
    match_mode: "Semantic"
    namespaces:
      - "freemarker.template"
      - "org.thymeleaf"
      - "org.apache.velocity"
      - "org.thymeleaf.context"
      - "io.pebbletemplates"
    receiver_patterns:
      - "template"
      - "engine"
      - "context"
      - "freemarkerConfig"
    patterns:
      - ".process"
      - ".getTemplate"
      - ".merge"
      - ".evaluate"
      - "Template.process"
      - "SpringResourceTemplateResolver"
      - "ClassLoaderTemplateResolver"
    exact_matches:
      - "Template.process"
      - "FreeMarkerTemplateUtils.processTemplateIntoString"
      - "Velocity.evaluate"
      - "VelocityContext"
      - "TemplateEngine.process"
      - "Thymeleaf.TemplateEngine.process"
      - "PebbleEngine.getTemplate"
    languages: ["java"]
    vulnerability_type: "CodeInjection"
    severity: "High"
    cwe_id: "CWE-94"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_log_injection"
    name: "Java Log Injection"
    description: "User-controlled data logged without sanitization — Log4j, SLF4J, Logback, JUL"
    match_mode: "Semantic"
    namespaces:
      - "org.slf4j"
      - "org.apache.logging.log4j"
      - "ch.qos.logback"
      - "java.util.logging"
    receiver_patterns:
      - "log"
      - "logger"
      - "LOG"
      - "LOGGER"
    patterns:
      - ".info"
      - ".warn"
      - ".error"
      - ".debug"
      - ".trace"
      - ".fatal"
    exact_matches:
      - "log.info"
      - "logger.info"
      - "logger.warn"
      - "logger.error"
      - "logger.debug"
      - "LOG.info"
      - "LOGGER.warn"
    languages: ["java"]
    vulnerability_type: "LogInjection"
    severity: "Medium"
    cwe_id: "CWE-117"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_xxe_parser"
    name: "Java XML External Entity"
    description: "XML parsers with default XXE-vulnerable configurations"
    match_mode: "Semantic"
    namespaces:
      - "javax.xml.parsers"
      - "org.xml.sax"
      - "javax.xml.stream"
      - "org.jdom2"
      - "org.dom4j"
      - "javax.xml.transform"
    receiver_patterns:
      - "factory"
      - "builder"
      - "parser"
      - "reader"
      - "saxParser"
      - "documentBuilder"
    patterns:
      - ".newInstance"
      - ".parse"
      - ".newDocumentBuilder"
      - ".newSAXParser"
      - ".newXMLStreamReader"
      - ".build"
    exact_matches:
      - "DocumentBuilderFactory.newInstance"
      - "SAXParserFactory.newInstance"
      - "XMLInputFactory.newFactory"
      - "SAXReader.read"
      - "DocumentBuilder.parse"
      - "SAXParser.parse"
    languages: ["java"]
    vulnerability_type: "XmlExternalEntity"
    severity: "High"
    cwe_id: "CWE-611"
    sensitive_params: [0]
    ast_patterns: []

  - id: "java_open_redirect"
    name: "Java Open Redirect"
    description: "HTTP redirect with user-controlled URL — sendRedirect, Spring redirect:"
    match_mode: "Semantic"
    namespaces:
      - "javax.servlet.http"
      - "jakarta.servlet.http"
      - "org.springframework.web.servlet.view"
      - "org.springframework.web.servlet"
    receiver_patterns:
      - "response"
      - "redirectView"
      - "modelAndView"
    patterns:
      - ".sendRedirect"
      - "redirect:"
      - "RedirectView"
    exact_matches:
      - "HttpServletResponse.sendRedirect"
      - "Response.sendRedirect"
      - "ModelAndView(\"redirect:"
      - "RedirectView"
    languages: ["java"]
    vulnerability_type: "OpenRedirect"
    severity: "Medium"
    cwe_id: "CWE-601"
    sensitive_params: [0]
    ast_patterns: []

sanitizers:
  - pattern: "PreparedStatement"
    description: "JDBC parameterized query"
  - pattern: "BindParam"
    description: "JPA/ORM parameter binding"
  - pattern: "ESAPI"
    description: "OWASP ESAPI encoder"
  - pattern: "StringEscapeUtils"
    description: "Apache Commons string escaping"
  - pattern: "HtmlUtils"
    description: "Spring HTML utilities"
  - pattern: "URLEncoder.encode"
    description: "URL encoding"
  - pattern: "Validator"
    description: "Bean validation"
  - pattern: "CommandEncoder"
    description: "Command argument encoding"
  - pattern: "ProcessBuilder"
    description: "ProcessBuilder with array args"
  - pattern: "HtmlUtils.htmlEscape"
    description: "Spring HTML escape"
  - pattern: "PolicyFactory.sanitize"
    description: "OWASP HTML sanitizer"
  - pattern: "OwaspHtmlSanitizer"
    description: "OWASP HTML sanitizer"
  - pattern: "setSecure"
    description: "Cookie Secure flag"
  - pattern: "setHttpOnly"
    description: "Cookie HttpOnly flag"
  - pattern: "setSameSite"
    description: "Cookie SameSite flag"
  - pattern: "Encode.forHtml"
    description: "OWASP Encoder HTML encoding"
  - pattern: "Sanitizers.HTML"
    description: "Sanitizers HTML cleanup"
  - pattern: "JdbcTemplate"
    description: "Spring JDBC parameterized template"
  - pattern: "queryForObject"
    description: "Spring parameterized query"
  - pattern: "SecurityFilterChain"
    description: "Spring Security filter chain"
  - pattern: "@PreAuthorize"
    description: "Spring Security method authorization"
  - pattern: "@Secured"
    description: "Spring Security annotation"
  - pattern: "CsrfToken"
    description: "Spring CSRF protection"
  - pattern: "StringUtils.hasText"
    description: "Spring input validation"
  - pattern: "Objects.requireNonNull"
    description: "Java null validation"
  - pattern: "Whitelist"
    description: "Generic whitelist validation"
  - pattern: "Paths.normalize"
    description: "Java path normalization"
  - pattern: "FilenameUtils.normalize"
    description: "Apache Commons filename normalization"
  - pattern: "strictHttpFirewall"
    description: "Spring Security HTTP firewall"
  - pattern: "SAXParserFactory.setFeature"
    description: "SAX secure feature flag"
  - pattern: "DocumentBuilderFactory.setFeature"
    description: "DOM secure feature flag"
  - pattern: "getSession()"
    description: "Internal HTTP session access, not outbound SSRF"
  - pattern: "getRequest()"
    description: "Internal servlet request access, not outbound SSRF"
  - pattern: "getRequestUri"
    description: "Internal request URI parsing, not outbound SSRF"
  - pattern: "ServerWebExchange"
    description: "Spring WebFlux internal exchange, not outbound SSRF"
  - pattern: "ProxyExchange"
    description: "Spring Cloud Gateway internal proxy, forwarding is by design"
  - pattern: "SimpleEvaluationContext"
    description: "SpEL evaluation context with restricted access"
  - pattern: "PropertyAccessor"
    description: "SpEL safe property access configuration"
