kind: taint-rules
name: "Spring / Java Taint Rules"
version: "1.0"

sources:
  - id: "spring_request_param"
    name: "Spring @RequestParam"
    description: "HTTP request parameters via Spring annotations"
    patterns:
      - "@RequestParam"
      - "@PathVariable"
      - "@RequestHeader"
      - "@CookieValue"
      - "@RequestPart"
      - "@MatrixVariable"
      - "@RequestAttribute"
      - "getParameter"
      - "getParameterValues"
      - "getQueryString"
    languages: ["java"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

  - id: "spring_request_body"
    name: "Spring @RequestBody"
    description: "Deserialized request body via Spring annotations"
    patterns:
      - "@RequestBody"
      - "getInputStream"
      - "getReader"
      - "MultipartFile"
      - "getParts"
      - "getOriginalFilename"
    languages: ["java"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

  - id: "spring_http_session"
    name: "Spring HTTP Session"
    description: "Session attributes that may be user-controlled"
    patterns:
      - "getSession"
      - "@SessionAttribute"
      - "getAttribute"
      - "getCookies"
    languages: ["java"]
    severity: "Medium"
    category: "UserInput"
    ast_patterns: []

sinks:
  - id: "spring_jdbc_query"
    name: "Spring JDBC Query"
    description: "JDBC query execution with potential SQL injection"
    match_mode: "Semantic"
    namespaces:
      - "org.springframework.jdbc.core"
      - "java.sql"
      - "javax.persistence"
    receiver_patterns:
      - "jdbcTemplate"
      - "statement"
      - "stmt"
      - "entityManager"
      - "session"
    patterns:
      - ".query"
      - ".update"
      - ".execute"
      - "createQuery"
      - "createNativeQuery"
      - "nativeQuery"
    exact_matches:
      - "JdbcTemplate.query"
      - "JdbcTemplate.update"
      - "JdbcTemplate.execute"
      - "Statement.execute"
      - "PreparedStatement.execute"
      - "createQuery"
      - "createNativeQuery"
    languages: ["java"]
    vulnerability_type: "SqlInjection"
    severity: "Critical"
    cwe_id: "CWE-89"
    sensitive_params: [0]
    ast_patterns: []

  - id: "spring_runtime_exec"
    name: "Java Runtime Exec"
    description: "System command execution"
    match_mode: "Semantic"
    namespaces:
      - "java.lang.Runtime"
      - "java.lang.ProcessBuilder"
    patterns:
      - ".exec"
      - ".command"
      - ".start"
      - "ProcessBuilder"
    exact_matches:
      - "Runtime.getRuntime().exec"
      - "ProcessBuilder.command"
      - "ProcessBuilder.start"
    languages: ["java"]
    vulnerability_type: "CommandInjection"
    severity: "Critical"
    cwe_id: "CWE-78"
    sensitive_params: [0]
    ast_patterns: []

  - id: "spring_script_engine"
    name: "Java Script Engine Eval"
    description: "Script engine dynamic code evaluation"
    match_mode: "Semantic"
    namespaces:
      - "javax.script"
      - "groovy.lang"
    patterns:
      - ".eval"
      - ".evaluate"
      - ".parse"
      - "ScriptEngineManager"
    exact_matches:
      - "ScriptEngine.eval"
      - "GroovyShell.evaluate"
      - "GroovyShell.parse"
    languages: ["java"]
    vulnerability_type: "CodeInjection"
    severity: "Critical"
    cwe_id: "CWE-94"
    sensitive_params: [0]
    ast_patterns: []

  - id: "spring_file_operations"
    name: "Java File Operations"
    description: "File operations with user-controlled paths"
    match_mode: "Substring"
    patterns:
      - "new FileInputStream"
      - "new FileOutputStream"
      - "new File("
      - "Files.readAllLines"
      - "Files.write"
      - "Paths.get"
    languages: ["java"]
    vulnerability_type: "PathTraversal"
    severity: "High"
    cwe_id: "CWE-22"
    sensitive_params: [0]
    ast_patterns: []

  - id: "spring_deserialization"
    name: "Java Insecure Deserialization"
    description: "Java native deserialization of untrusted data"
    match_mode: "Substring"
    patterns:
      - "ObjectInputStream"
      - "readObject"
      - "readUnshared"
      - "XMLDecoder"
      - "XStream"
      - "fromXML"
    languages: ["java"]
    vulnerability_type: "InsecureDeserialization"
    severity: "Critical"
    cwe_id: "CWE-502"
    sensitive_params: [0]
    ast_patterns: []

  - id: "spring_ssti"
    name: "Spring Template Injection"
    description: "Spring SpEL or template expression evaluation"
    match_mode: "Semantic"
    namespaces:
      - "org.springframework.expression"
    patterns:
      - "SpelExpressionParser"
      - "parseExpression"
      - "ExpressionParser"
      - ".getValue"
    exact_matches:
      - "SpelExpressionParser.parseExpression"
      - "parseExpression"
      - "getValue"
    languages: ["java"]
    vulnerability_type: "CodeInjection"
    severity: "Critical"
    cwe_id: "CWE-94"
    sensitive_params: [0]
    ast_patterns: []

sanitizers:
  - pattern: "PreparedStatement"
    description: "Java prepared statements"
  - pattern: "ParameterizedPreparedStatementCreator"
    description: "Spring parameterized statement"
  - pattern: "ESAPI.encoder"
    description: "OWASP ESAPI encoding"
  - pattern: "StringEscapeUtils"
    description: "Apache Commons text escaping"
  - pattern: "encodeForSQL"
    description: "ESAPI SQL encoding"
  - pattern: "validate"
    description: "Generic validation"
