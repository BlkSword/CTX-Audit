kind: taint-rules
name: "Go Taint Rules"
version: "1.0"

sources:
  - id: "go_http_request"
    name: "Go HTTP Request"
    description: "HTTP request parameters, headers, and body from net/http and Gin/Echo frameworks"
    patterns:
      - "r.URL.Query().Get"
      - "r.URL.Query().GetAll"
      - "r.FormValue"
      - "r.PostFormValue"
      - "r.Header.Get"
      - "r.Header.Values"
      - "r.Body"
      - "r.Cookie"
      - "req.URL.Query().Get"
      - "req.FormValue"
      - "http.Request"
      - "gin.Context"
      - "c.Query"
      - "c.Param"
      - "c.PostForm"
      - "c.GetHeader"
      - "c.DefaultQuery"
      - "c.DefaultPostForm"
      - "c.ShouldBind"
      - "c.ShouldBindJSON"
      - "c.ShouldBindQuery"
      - "c.ShouldBindUri"
      - "c.Bind"
      - "c.BindJSON"
      - "c.BindQuery"
      - "c.BindUri"
      - "c.Request.URL"
      - "c.Request.Body"
      - "c.ClientIP"
      - "echo.Context"
      - "c.QueryString"
      - "c.FormValue"
      - "c.RealIP"
    languages: ["go"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

  - id: "go_cli_env"
    name: "Go CLI and Environment"
    description: "Command-line arguments and environment variables"
    patterns:
      - "os.Args"
      - "os.Getenv"
      - "os.Getpid"
    languages: ["go"]
    severity: "Medium"
    category: "UserInput"
    ast_patterns: []

  - id: "go_file_input"
    name: "Go File Input"
    description: "Data read from files or standard input"
    patterns:
      - "os.ReadFile"
      - "ioutil.ReadFile"
      - "ioutil.ReadAll"
      - "bufio.Scanner.Text"
      - "bufio.Reader.ReadString"
      - "os.Stdin"
    languages: ["go"]
    severity: "Medium"
    category: "FileInput"
    ast_patterns: []

  - id: "go_router_upload_input"
    name: "Go Router Params and Multipart Upload"
    description: "Path params (gorilla/mux, chi) and multipart upload metadata (filename is attacker-controlled; filepath.Base normalization is platform-dependent and keeps backslash traversal on Linux)"
    patterns:
      - "mux.Vars"
      - "chi.URLParam"
      - "part.FileName"
      - "FormFile"
      - "MultipartForm"
      - "r.URL.Path"
      - "r.URL.RawQuery"
      - "req.URL.Path"
      - "r.Host"
    languages: ["go"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

sinks:
  - id: "go_sql_exec"
    name: "Go SQL Execution"
    description: "SQL execution via database/sql and ORMs"
    match_mode: "Semantic"
    namespaces:
      - "database/sql"
      - "gorm.io"
      - "github.com/jinzhu/gorm"
      - "github.com/go-xorm"
      - "upper.io"
    receiver_patterns:
      - "db"
      - "tx"
      - "conn"
      - "stmt"
      - "orm"
      - "gorm"
    patterns:
      - ".Query"
      - ".QueryRow"
      - ".Exec"
      - ".Raw"
      - ".Prepare"
    exact_matches:
      - "db.Query"
      - "db.QueryRow"
      - "db.Exec"
      - "db.Raw"
      - "tx.Query"
      - "tx.Exec"
      - "stmt.Query"
      - "stmt.Exec"
    languages: ["go"]
    vulnerability_type: "SqlInjection"
    severity: "Critical"
    cwe_id: "CWE-89"
    sensitive_params: [0]
    ast_patterns: []

  - id: "go_cmd_exec"
    name: "Go Command Execution"
    description: "OS command execution via os/exec"
    match_mode: "Semantic"
    namespaces:
      - "os/exec"
      - "golang.org/x/sys/execabs"
    receiver_patterns:
      - "cmd"
      - "command"
    patterns:
      - "exec.Command"
      - "exec.CommandContext"
      - ".Run"
      - ".Output"
      - ".CombinedOutput"
      - ".Start"
    exact_matches:
      - "exec.Command"
      - "exec.CommandContext"
      - "os/exec.Command"
    languages: ["go"]
    vulnerability_type: "CommandInjection"
    severity: "Critical"
    cwe_id: "CWE-78"
    sensitive_params: [0]
    ast_patterns: []

  - id: "go_ssrf"
    name: "Go SSRF"
    description: "Outbound HTTP requests with user-controlled URLs"
    match_mode: "Semantic"
    namespaces:
      - "net/http"
      - "github.com/go-resty"
      - "github.com/parnurzeal/gorequest"
    receiver_patterns:
      - "client"
      - "http"
    patterns:
      - "http.Get"
      - "http.Post"
      - "http.PostForm"
      - "http.Do"
      - "http.Head"
      - ".Get"
      - ".Post"
      - ".Do"
    exact_matches:
      - "http.Get"
      - "http.Post"
      - "http.PostForm"
      - "http.Head"
      - "Client.Do"
      - "http.Client.Do"
    languages: ["go"]
    vulnerability_type: "ServerSideRequestForgery"
    severity: "High"
    cwe_id: "CWE-918"
    sensitive_params: [0]
    ast_patterns: []

  - id: "go_file_path"
    name: "Go File Path"
    description: "File system operations with user-controlled paths"
    match_mode: "Semantic"
    namespaces:
      - "os"
      - "io/ioutil"
      - "path"
      - "path/filepath"
    patterns:
      - "os.Open"
      - "os.OpenFile"
      - "os.Create"
      - "os.ReadFile"
      - "os.WriteFile"
      - "ioutil.WriteFile"
      - "ioutil.ReadFile"
      - "os.Remove"
      - "os.RemoveAll"
      - "os.Rename"
      - "os.Mkdir"
      - "os.MkdirAll"
      - "os.Stat"
      - "os.Lstat"
      - "os.Chmod"
      - "os.Chown"
      - "os.Truncate"
      - "filepath.Join"
      - "path.Join"
      - "fmt.Sprintf"
      - ".Remove("
      - ".RemoveAll("
      - ".Rename("
      - ".Mkdir("
      - ".MkdirAll("
      - ".Create("
      - ".Open("
      - ".OpenFile("
      - ".WriteFile("
      - ".ReadFile("
    exact_matches:
      - "os.Open"
      - "os.OpenFile"
      - "os.Create"
      - "os.WriteFile"
      - "os.Remove"
      - "os.RemoveAll"
      - "os.Rename"
      - "os.Mkdir"
      - "os.MkdirAll"
    languages: ["go"]
    vulnerability_type: "PathTraversal"
    severity: "High"
    cwe_id: "CWE-22"
    sensitive_params: [0]
    ast_patterns: []

  - id: "go_archive_entry"
    name: "Go Archive Entry Name"
    description: "zip/tar archive entry created with a user-controlled name (zip slip). Entry names must be sanitized — filepath.Base is platform-dependent and keeps backslash traversal on Linux servers"
    match_mode: "Semantic"
    namespaces:
      - "archive/zip"
      - "archive/tar"
    receiver_patterns:
      - "archive"
      - "zw"
      - "tw"
    patterns:
      - ".CreateHeader"
      - "zip.FileHeader"
      - "tar.Header"
    exact_matches:
      - "archive.CreateHeader"
      - "zip.CreateHeader"
    languages: ["go"]
    vulnerability_type: "PathTraversal"
    severity: "High"
    cwe_id: "CWE-22"
    sensitive_params: [0]
    ast_patterns: []

  - id: "go_template_injection"
    name: "Go Template Injection"
    description: "text/template and html/template execution with user input"
    match_mode: "Semantic"
    namespaces:
      - "text/template"
      - "html/template"
    patterns:
      - "template.Parse"
      - "template.New"
      - "template.Execute"
      - ".Execute"
      - ".ExecuteTemplate"
    exact_matches:
      - "template.Execute"
      - "template.ExecuteTemplate"
    languages: ["go"]
    vulnerability_type: "CodeInjection"
    severity: "Critical"
    cwe_id: "CWE-94"
    sensitive_params: [0]
    ast_patterns: []

  - id: "go_xss_output"
    name: "Go XSS Output"
    description: "Gin/Echo/nethttp response methods that write user-controlled content"
    match_mode: "Semantic"
    namespaces:
      - "github.com/gin-gonic/gin"
      - "github.com/labstack/echo"
      - "net/http"
    receiver_patterns:
      - "c"
      - "ctx"
      - "w"
      - "rw"
      - "response"
    patterns:
      - "c.HTML"
      - "c.String"
      - "c.XML"
      - "c.JSON"
      - "c.IndentedJSON"
      - "c.SecureJSON"
      - "c.JSONP"
      - "c.YAML"
      - "c.AsciiJSON"
      - "c.ProtoBuf"
      - "c.Data"
      - "c.Redirect"
      - "c.Header"
      - "ctx.HTML"
      - "ctx.String"
      - "ctx.XML"
      - "ctx.JSON"
      - "w.Write"
      - ".Write"
      - "fmt.Fprint"
      - "fmt.Fprintf"
      - "template.HTML"
      - "template.JS"
      - "template.URL"
      - "template.HTMLAttr"
    exact_matches:
      - "c.HTML"
      - "c.String"
      - "c.XML"
      - "ctx.HTML"
      - "w.Write"
      - "template.HTML"
      - "template.JS"
    languages: ["go"]
    vulnerability_type: "CrossSiteScripting"
    severity: "High"
    cwe_id: "CWE-79"
    sensitive_params: [0, 1]
    ast_patterns: []

sanitizers:
  - pattern: "html/template"
    description: "HTML auto-escaping template"
  - pattern: "url.Parse"
    description: "URL parsing validation"
  - pattern: "strconv.Atoi"
    description: "Integer parsing"
  - pattern: "strconv.ParseInt"
    description: "Integer parsing"
  - pattern: "validator"
    description: "Go validator package"
