kind: taint-rules
name: "React / Next.js Taint Rules"
version: "1.0"

sources:
  - id: "react_formdata"
    name: "React FormData"
    description: "FormData entries from server actions or form submissions"
    patterns:
      - "formData.get"
      - "formData.getAll"
      - "formData.entries"
      - "formData.has"
      - "formData.values"
    languages: ["javascript", "typescript"]
    severity: "High"
    category: "UserInput"
    ast_patterns:
      - node_type: "call_expression"
        name: "get"
        properties:
          object: "formData"
        languages: ["javascript", "typescript"]

  - id: "nextjs_cookies"
    name: "Next.js Cookies"
    description: "Cookie values from next/headers"
    patterns:
      - "cookies().get"
      - "cookies().getAll"
    languages: ["javascript", "typescript"]
    severity: "Medium"
    category: "UserInput"
    ast_patterns: []

  - id: "nextjs_headers"
    name: "Next.js Headers"
    description: "Request header values from next/headers"
    patterns:
      - "headers().get"
    languages: ["javascript", "typescript"]
    severity: "Medium"
    category: "NetworkInput"
    ast_patterns: []

  - id: "nextjs_search_params"
    name: "Next.js Search Params"
    description: "URL search parameters in page components"
    patterns:
      - "searchParams.get"
      - "searchParams.getAll"
    languages: ["javascript", "typescript"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

  - id: "nextjs_request_body"
    name: "Next.js Request Body"
    description: "Request body from NextRequest or NextResponse"
    patterns:
      - "request.text"
      - "request.json"
      - "request.formData"
      - "req.jsonBody"
    languages: ["javascript", "typescript"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

  - id: "nextjs_request_headers"
    name: "Next.js Request Headers"
    description: "HTTP request headers that may be attacker-controlled (Host, X-Forwarded-Host, etc.)"
    patterns:
      - "req.headers.host"
      - "req.headers["
      - "request.headers.host"
      - "request.headers["
      - "req.getHeader("
      - "request.getHeader("
      - "x-forwarded-host"
      - "x-forwarded-for"
      - "x-forwarded-proto"
    languages: ["javascript", "typescript"]
    severity: "High"
    category: "NetworkInput"
    ast_patterns: []

  - id: "nextjs_params"
    name: "Next.js Route Params"
    description: "Dynamic route parameters in Next.js App/Pages Router"
    patterns:
      - "params."
      - "searchParams."
      - "useSearchParams"
      - "useParams"
    languages: ["javascript", "typescript"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

  - id: "nextjs_pages_router_query"
    name: "Next.js Pages Router Query"
    description: "URL query parameters in Pages Router (getServerSideProps context / useRouter)"
    patterns:
      - "context.query"
      - "ctx.query"
      - "router.query"
    languages: ["javascript", "typescript"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

  - id: "nextjs_pages_router_query"
    name: "Next.js Pages Router Query"
    description: "URL query parameters in Pages Router (getServerSideProps context / useRouter)"
    patterns:
      - "context.query"
      - "ctx.query"
      - "router.query"
    languages: ["javascript", "typescript"]
    severity: "High"
    category: "UserInput"
    ast_patterns: []

sinks:
  - id: "react_dangerously_set_inner_html"
    name: "dangerouslySetInnerHTML"
    description: "React prop that injects raw HTML — primary XSS vector"
    patterns:
      - "dangerouslySetInnerHTML"
    languages: ["javascript", "typescript"]
    vulnerability_type: "CrossSiteScripting"
    severity: "Critical"
    cwe_id: "CWE-79"
    sensitive_params: [0]
    ast_patterns:
      - node_type: "jsx_attribute"
        name: "dangerouslySetInnerHTML"
        languages: ["javascript", "typescript"]

  - id: "react_parse_model"
    name: "React parseModel (RSC Flight)"
    description: "React RSC Flight protocol model parsing — deserialization risk (CVE-2025-55182)"
    patterns:
      - "parseModel"
      - "resolveModel"
      - "parseModelString"
      - "resolveModelString"
      - "parseModelFrom"
    languages: ["javascript", "typescript"]
    vulnerability_type: "InsecureDeserialization"
    severity: "Critical"
    cwe_id: "CWE-502"
    sensitive_params: [0]
    ast_patterns: []

  - id: "react_eval"
    name: "eval in React"
    description: "Dynamic code execution in React components or server actions"
    match_mode: "Semantic"
    namespaces:
      - "vm"
    patterns:
      - "eval("
      - "new Function("
      - "Function("
      - ".runInContext"
      - ".runInNewContext"
      - ".compileFunction"
    exact_matches:
      - "vm.runInContext"
      - "vm.runInNewContext"
      - "vm.compileFunction"
    languages: ["javascript", "typescript"]
    vulnerability_type: "CodeInjection"
    severity: "Critical"
    cwe_id: "CWE-94"
    sensitive_params: [0]
    ast_patterns: []

  - id: "nextjs_dynamic_import"
    name: "Dynamic Import with User Input"
    description: "Dynamic import() with user-controlled path"
    match_mode: "Substring"
    patterns:
      - "import("
    languages: ["javascript", "typescript"]
    vulnerability_type: "CodeInjection"
    severity: "High"
    cwe_id: "CWE-94"
    sensitive_params: [0]
    ast_patterns: []

  - id: "nextjs_redirect"
    name: "Next.js Redirect"
    description: "Redirect with user-controlled URL — open redirect and SSRF vector"
    match_mode: "Semantic"
    namespaces:
      - "next"
      - "next/navigation"
      - "next/server"
    patterns:
      - "redirect("
      - "permanentRedirect("
      - ".redirect("
      - ".rewrite("
      - ".json("
    exact_matches:
      - "NextResponse.redirect"
      - "NextResponse.rewrite"
      - "NextResponse.json"
    languages: ["javascript", "typescript"]
    vulnerability_type: "OpenRedirect"
    severity: "High"
    cwe_id: "CWE-601"
    sensitive_params: [0]
    ast_patterns: []

  - id: "nextjs_router_navigation"
    name: "Client-side Router Navigation"
    description: "router.replace/push with user-controlled URL — open redirect and javascript: scheme XSS vector (Pages Router useRouter)"
    match_mode: "Semantic"
    receiver_patterns:
      - "router"
    patterns:
      - ".replace("
      - ".push("
    languages: ["javascript", "typescript"]
    vulnerability_type: "OpenRedirect"
    severity: "High"
    cwe_id: "CWE-601"
    sensitive_params: [0]
    ast_patterns: []

  - id: "nextjs_router_navigation"
    name: "Client-side Router Navigation"
    description: "router.replace/push with user-controlled URL — open redirect and javascript: scheme XSS vector (Pages Router useRouter)"
    match_mode: "Semantic"
    receiver_patterns:
      - "router"
    patterns:
      - ".replace("
      - ".push("
    languages: ["javascript", "typescript"]
    vulnerability_type: "OpenRedirect"
    severity: "High"
    cwe_id: "CWE-601"
    sensitive_params: [0]
    ast_patterns: []

  - id: "nextjs_response_header"
    name: "Response Header Injection"
    description: "User input written to HTTP response headers"
    patterns:
      - "setHeader("
      - ".setHeader("
      - "response.setHeader("
      - "res.setHeader("
    languages: ["javascript", "typescript"]
    vulnerability_type: "HeaderInjection"
    severity: "Medium"
    cwe_id: "CWE-113"
    sensitive_params: [1]
    ast_patterns: []

  - id: "nextjs_cache_operation"
    name: "Cache Manipulation"
    description: "Cache operations with user-controlled input — cache poisoning vector"
    patterns:
      - "revalidatePath("
      - "revalidateTag("
    languages: ["javascript", "typescript"]
    vulnerability_type: "CachePoisoning"
    severity: "Medium"
    cwe_id: "CWE-444"
    sensitive_params: [0]
    ast_patterns: []

  - id: "nextjs_response_write"
    name: "Route Handler Response"
    description: "Route handler response with user-controlled data"
    patterns:
      - "Response.json("
      - "new Response("
      - "NextResponse.json("
    languages: ["javascript", "typescript"]
    vulnerability_type: "CrossSiteScripting"
    severity: "Medium"
    cwe_id: "CWE-79"
    sensitive_params: [0]
    ast_patterns: []

sanitizers:
  - pattern: "DOMPurify.sanitize"
    description: "DOMPurify HTML sanitizer"
  - pattern: "sanitizeHtml"
    description: "sanitize-html library"
  - pattern: "escapeHtml"
    description: "HTML entity escaping"
  - pattern: "encodeURI"
    description: "URI encoding"
  - pattern: "encodeURIComponent"
    description: "URI component encoding"
