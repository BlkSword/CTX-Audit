category: security-misconfiguration
cwe: CWE-502
php_bare_call_only: true
description: 检测 PHP unserialize 间接变量来源：unserialize 的参数为普通变量，需人工确认数据是否外部可控（数据库内容、缓存、session 等二阶来源通常风险较低）
id: php-unserialize-variable
language: php
name: PHP Unserialize with Indirect Variable
owasp: "A08:2021-Software and Data Integrity Failures"
patterns:
  - language: php
    # 排除方法/静态调用形态（->unserialize(、::unserialize(）——自定义同名方法（如 json_decode 封装）不是内建反序列化
    pattern: '(?i)(?:^|[^\w.>:])unserialize\s*\(\s*\$'
severity: medium
remediation: "使用 json_decode 替代 unserialize；如必须使用，设置 allowed_classes 选项；避免反序列化用户可控数据。"
references:
  - "https://owasp.org/www-community/vulnerabilities/PHP_Object_Injection"
