category: injection
cwe: CWE-918
description: 检测服务端请求伪造（SSRF）风险：用户输入直接用于 URL 请求
id: ssrf-detection
language: all
name: Server-Side Request Forgery (SSRF) Detection
owasp: "A10:2021-Server-Side Request Forgery"
remediation: "使用白名单验证 URL；限制请求目标为内网 IP 范围之外；禁止访问 127.0.0.1、169.254.169.254 等敏感地址；使用网络层防火墙限制出站请求。"
references:
  - "https://owasp.org/www-community/attacks/Server_Side_Request_Forgery"
  - "https://cwe.mitre.org/data/definitions/918.html"
patterns:
  - language: python
    pattern: '(?i)(requests\.(get|post|put|delete|patch)\s*\(\s*[^)]*request\.|urllib\.request\.urlopen\s*\(\s*[^)]*request|http\.client\.)'
  - language: javascript
    pattern: '(?i)(fetch\s*\(\s*req\.|axios\.\w+\s*\(\s*req\.|http\.get\s*\(\s*req\.|request\s*\(\s*req\.)'
  - language: java
    pattern: '(?i)(URL\s*\(\s*request|HttpURLConnection\s*\(\s*request|RestTemplate\.\w+\s*\(\s*request)'
  - language: php
    pattern: '(?i)(file_get_contents\s*\(\s*\$_(GET|POST|REQUEST)|curl_exec\s*\(|fopen\s*\(\s*\$_)'
  - language: go
    pattern: '(?i)(http\.Get\s*\(\s*r\.(URL|FormValue)|http\.Post\s*\(\s*r\.(URL|FormValue))'
severity: high
