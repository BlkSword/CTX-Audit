# 审计证据包：硬编码密钥/凭证（CWE-259 / CWE-798）
kind: audit-pack
id: "cwe-259-798-secrets"
name: "硬编码密钥与凭证取证包"
vuln_types:
  - "secrets"
  - "hardcoded-password"
  - "hardcoded-crypto-key"
  - "no_hardcoded_passwords"
  - "config-weak-secret"
  - "HardcodedCredentials"
cwe:
  - "CWE-259"
  - "CWE-798"
evidence_steps:
  - tool: get_code_context
    purpose: "确认命中的值是真实密钥还是占位符/示例值：USER_PASSWORD、changeme、xxxx、your-api-key、example、test、123456 等占位符 → FP。脱敏展示代码本身（password=\"******\"、日志脱敏）也 → FP。"
  - tool: get_code_context
    purpose: "区分密钥类型：登录口令（CWE-259）vs 硬编码加密/签名密钥（cipherKey、aesKey、secretKey 等等长常量，CWE-798）。后者即使看起来像随机串也是 TP，因为硬编码密钥正是漏洞本体（参考 Shiro 默认密钥）。"
  - tool: search_code
    purpose: "搜该常量是否被引用到安全关键路径：加密/解密、HMAC 签名、JWT 签发、数据库连接。确认是真实使用的密钥还是死代码/默认兜底值（兜底值若生产可生效仍是 TP）。"
  - tool: search_code
    purpose: "搜同名配置是否可被环境变量/配置文件覆盖：getenv 优先于硬编码兜底 → 降级；硬编码值无条件生效 → TP。同时确认文件角色，测试 fixture 中的假密钥 → FP。"
  - tool: get_code_context
    purpose: "评估密钥强度与暴露面：弱口令（admin/admin）用于默认账户 → TP 且高危；密钥仅出现在文档/README 示例 → FP。"
tp_criteria:
  - "真实密钥/口令硬编码且被安全关键路径（加密、签名、认证）引用"
  - "硬编码加密密钥为等长常量（如 16/24/32 字节 AES 密钥），无环境覆盖机制"
  - "默认弱口令在生产代码中无条件生效"
fp_criteria:
  - "值为占位符或示例（USER_PASSWORD、changeme、xxxx、your-*-here、example.com 专用串）"
  - "代码是脱敏/掩码逻辑本身（password=\"******\" 仅用于日志展示）"
  - "硬编码值仅为兜底且环境变量/配置优先覆盖，且兜底值在文档中明确为开发用"
  - "位于测试 fixture、文档、示例目录"
confidence_guide: "确认为真实密钥 + 被安全路径引用 → 0.9+；常量形态像密钥但用途未追完 → 0.7-0.9；值介于占位符与真实密钥之间难以区分 → <0.7，判 needs_review 并引用具体字符串特征说明。"
