# 审计证据包：缺失授权 / 越权（Missing Authorization / IDOR / BOLA）
kind: audit-pack
id: "cwe-862-863-authorization"
name: "缺失授权与越权（CWE-862/CWE-863）取证包"
vuln_types:
  - "missing-authorization"
  - "missing_authorization"
  - "UnauthenticatedEndpoint"
  - "unauthorized"
  - "idor"
  - "bola"
  - "broken-access-control"
  - "access-control"
cwe:
  - "CWE-862"
  - "CWE-863"
  - "CWE-639"
evidence_steps:
  - tool: get_framework_context
    purpose: "先读该端点的保护面事实，这是本包最快的分流点：`global_coverage` + `global_match`（是否被鉴权链覆盖、命中规则的**子句**与**出处**）；若为 `no_global_match_found`，读 `global_scope` 看**实际声明了哪些范围**（端点可能在范围之外）；`coverage_caveat` 非空说明该判定不完整；`auth_effect` + `method_level_auth`/`class_level_auth` 看注解层授权；`container_filters` 与 `interceptors` 是另外两个保护面（只陈述，不并入覆盖判定）。注意 `no_global_config_found` 只表示**未读到配置**，不等于无保护；`framework_not_modeled` 表示该栈未建模，保护面**未知**。"
  - tool: slice_backward
    purpose: "确认命中点所在函数体是否做了身份/属主校验（currentUser / session / owner / isAdmin / hasRole / permission），以及是否**只校验了登录而未校验属主**——后者是 IDOR/BOLA 的典型形态。"
  - tool: get_call_hierarchy
    purpose: "direction=\"callers\" 反向追到路由/入口，确认该函数确实被外部路由暴露（未注册路由不构成可达）；`unresolved_edges` 非 0 时按「调用图未闭合」处理，不得据此断言不可达。"
  - tool: get_symbol_references
    purpose: "搜索授权关键字（currentUser / owner / isAdmin / hasRole / permission / scope）在整个项目里的用法，识别是否存在统一的授权辅助函数及其调用约定。"
  - tool: slice_backward
    purpose: "对照同类资源操作（get / update / delete）是否有统一的授权校验：同一控制器里其它操作有校验而本操作没有，是缺失授权的强信号（把两处切片并列写进证据）。"
tp_criteria:
  - "`global_coverage=no_global_match_found` 且 `global_scope` 显示该端点不在任何已声明范围内，同时函数体无属主/身份校验"
  - "资源操作（按 id/name 的 get/delete/update/remove 等）函数体内没有身份/属主校验"
  - "路由可被外部请求到达，且没有认证中间件覆盖"
  - "同文件/同控制器其他资源操作存在授权校验，而当前操作缺失"
  - "数据来源为 HTTP 参数中的资源标识（id、name、path 等），且未绑定到当前用户"
  - "通过替换资源标识即可访问其他用户/租户的数据（IDOR/BOLA）"
fp_criteria:
  - "`global_coverage=covered_by_global_config` 且 `global_match.clause` 非 `permitAll`（带出处）——存在全局鉴权门"
  - "函数体或调用链上存在有效的身份/属主校验（currentUser/owner/isAdmin/hasRole/权限校验）"
  - "路由被认证中间件全局覆盖，且该操作无需额外属主校验（如管理员操作）"
  - "资源标识来自服务端会话/内部状态，攻击者不可控"
  - "操作为公开设计内端点（登录/注册/健康检查等白名单路由）"
  - "`permitted_by_global_config` 只说明端点被**显式声明为公开**，不单独构成 FP 依据——公开是否合理要回到威胁模型与设计文档"
  - "测试、构建、vendor 文件"
confidence_guide: "调用链完整追到外部路由 + 确认函数体无授权校验 + 同类操作有校验对照 → 0.9+；只看到函数体无校验但未确认路由可达 → 0.7-0.9；存在部分校验但可绕过（如仅登录未校验属主）→ 0.5-0.7，判 needs_review。**字段口径**：`covered_by_global_config` 与 `permitted_by_global_config` 都是**强事实**（分别=有全局鉴权门、被显式声明公开），但前者不证明细粒度授权、后者不证明公开合理；`no_global_config_found` / `framework_not_modeled` 都**不得**写成「无鉴权」；`coverage_caveat` 非空时按「判定不完整」降置信度并如实标注。"
