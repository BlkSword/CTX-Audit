# 审计证据包：开放重定向（CWE-601）
kind: audit-pack
id: "cwe-601-open-redirect"
name: "开放重定向审计取证包"
vuln_types:
  - "OpenRedirect"
  - "open-redirect"
  - "open_redirect"
  - "CWE-601"
cwe:
  - "CWE-601"
evidence_steps:
  - tool: get_code_context
    purpose: "确认重定向目标来自用户输入：request.path/raw_path/query/args/params 等，且不是固定白名单/相对路径"
  - tool: query_callers
    purpose: "追到路由/中间件入口，确认攻击者能够控制该输入并触发重定向"
  - tool: search_code
    purpose: "搜索是否有白名单校验、scheme 校验（http/https only）、内部跳转编码；存在完整校验 → FP"
  - tool: get_code_context
    purpose: "确认命中点是否在测试/夹具文件中；测试文件中的固定重定向不构成漏洞"
tp_criteria:
  - "重定向目标由外部可控输入动态构造"
  - "无白名单/scheme 校验或校验可绕过"
  - "路由或中间件可被远程攻击者触达"
fp_criteria:
  - "目标是常量/相对路径/同源 URL"
  - "存在严格 URL 白名单校验"
  - "命中点位于测试/夹具/vendor 目录"
  - "仅设置无害 header，不产生实际跳转"
confidence_guide: "远程可控目标 + 无校验 + 生产路径可达 → 0.9+；仅疑似动态但输入路径未确认 → 0.6-0.8。"
