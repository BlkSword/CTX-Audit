category: injection
cwe: CWE-134
description: 检测 C/C++ 格式化字符串漏洞：用户输入作为格式化参数
id: cpp-format-string
language: cpp
name: C/C++ Format String Vulnerability
owasp: "A03:2021-Injection"
patterns:
  # 匹配 printf/fprintf/sprintf/syslog 作为格式串的第一个参数（非字符串字面量时告警）
  # \b 边界排除 snprintf/vsnprintf 等有界变体
  # 负向字符集必须同时排除 \s，否则 \s* 回溯会让空白字符满足 [^"...] 导致字面量格式串误报
  - language: c
    pattern: '(?i)\b(printf\s*\(\s*[^"\x29\s]|fprintf\s*\([^,]+,\s*[^"\x29\s]|sprintf\s*\([^,]+,\s*[^"\x29\s]|syslog\s*\([^,]+,\s*[^"\x29\s])'
  - language: cpp
    pattern: '(?i)\b(printf\s*\(\s*[^"\x29\s]|fprintf\s*\([^,]+,\s*[^"\x29\s]|sprintf\s*\([^,]+,\s*[^"\x29\s]|syslog\s*\([^,]+,\s*[^"\x29\s])'
severity: critical
exclude_string_literals: true
remediation: "使用 %s 格式说明符包裹用户输入；使用 fputs/fwrite 替代 printf 输出已知字符串；编译时启用 -Wformat -Werror=format-security。"
references:
  - "https://owasp.org/www-community/attacks/Format_string_attack"
