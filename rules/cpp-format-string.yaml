category: injection
cwe: CWE-134
description: 检测 C/C++ 格式化字符串漏洞：用户输入作为格式化参数
id: cpp-format-string
language: cpp
name: C/C++ Format String Vulnerability
owasp: "A03:2021-Injection"
patterns:
  - language: c
    pattern: '(?i)(printf\s*\(\s*[^"]*\)|fprintf\s*\([^,]+,\s*[^"]*\)|sprintf\s*\([^,]+,\s*[^"]*\)|syslog\s*\([^,]+,\s*[^"]*\))'
  - language: cpp
    pattern: '(?i)(printf\s*\(\s*[^"]*\)|fprintf\s*\([^,]+,\s*[^"]*\)|sprintf\s*\([^,]+,\s*[^"]*\)|syslog\s*\([^,]+,\s*[^"]*\))'
severity: critical
remediation: "使用 %s 格式说明符包裹用户输入；使用 fputs/fwrite 替代 printf 输出已知字符串；编译时启用 -Wformat -Werror=format-security。"
references:
  - "https://owasp.org/www-community/attacks/Format_string_attack"
