category: security-misconfiguration
cwe: CWE-502
php_bare_call_only: true
description: 检测不安全的反序列化：使用不安全的反序列化方法
id: unsafe-deserialization
language: all
name: Unsafe Deserialization
owasp: "A08:2021-Software and Data Integrity Failures"
remediation: "避免对不可信数据进行反序列化；使用安全的序列化格式（如 JSON）；对反序列化数据进行完整性校验和类型白名单过滤。"
references:
  - "https://owasp.org/www-community/vulnerabilities/Deserialization_of_untrusted_data"
  - "https://cwe.mitre.org/data/definitions/502.html"
patterns:
  - language: java
    # ObjectInputStream/XMLDecoder/XStream 为运行时类型实例化 gadget 链（真 CWE-502）；
    # 裸 readObject( 已收窄为 ObjectInputStream 形态——jakarta.json JsonReader.readObject()
    # 等数据专用反序列化器无 gadget 链（10.21 判据 Java 侧，R57 误标 ×3 家族）
    pattern: (?i)(ObjectInputStream\s*\(|ObjectInputStream\.readObject\s*\(|readUnshared\s*\(|XMLDecoder\s*\(|XStream\s*\()
  # Python：yaml.load 两种危险形态——单变量参数（默认 Loader 不安全）、
  # 显式指定 Loader/CLoader/UnsafeLoader（SafeLoader/CSafeLoader/BaseLoader 名称中的
  # "Loader" 前有词字符，\b 边界保证不误命中）；Rust regex 不支持负向前瞻，用边界等价表达
  - language: python
    pattern: (?i)(pickle\.loads?\s*\(|marshal\.loads?\s*\(|yaml\.load\s*\(\s*[A-Za-z_][\w.]*\s*\)|yaml\.load\s*\([^)]*=\s*(?:yaml\.)?\b(?:C|Unsafe)?Loader\b|yaml\.unsafe_load\s*\(|dill\.loads?\s*\()
  # PHP：与 php-unsafe-deserialization/php-unserialize-variable 分级一致，
  # 任意 unserialize( 由 medium 规则覆盖，此处只保留直接超全局输入；
  # 排除方法/静态调用形态（->unserialize(、::unserialize(）
  - language: php
    pattern: (?i)(?:^|[^\w.>:])unserialize\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)
severity: critical
# 内外源区分（设计权衡）：regex 层无法追踪 readObject 的数据来源。
# 采用"自产自销回环"豁免——同文件在命中点之前出现 ObjectOutputStream/writeObject，
# 说明该应用自己序列化写入了这份数据（如搜索引擎对自己写出的
# 索引段做 ObjectInputStream 回读），数据源是内部可信文件而非外部输入，豁免。
# 已知残余盲区：攻击者若能改写该存储文件（如共享目录/被篡改的索引），
# 反序列化仍可被利用——该判断需要理解存储的写入口径，交给 LLM 判定层。
# sanitizer 为规则级（Java 特有字符串），Python/PHP 文件不会出现，不受影响。
sanitizers:
  - "ObjectOutputStream"
  - "writeObject"
