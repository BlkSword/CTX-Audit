category: dos
cwe: CWE-1333
description: 检测正则表达式拒绝服务（ReDoS）风险：包含灾难性回溯的正则模式
id: redos-detection
language: all
name: Regular Expression Denial of Service (ReDoS) Detection
owasp: "A05:2021-Security Misconfiguration"
remediation: "避免使用嵌套量词（如 (a+)+）；使用原子组或占有量词；限制正则匹配超时；使用安全正则库或静态分析工具检测危险模式。"
references:
  - "https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS"
  - "https://cwe.mitre.org/data/definitions/1333.html"
patterns:
  - language: javascript
    pattern: '(?:\((?:[^)]*\+|\*)\)\+|\((?:[^)]*\+|\*)\)\*|\(\?:[^)]*[+*][^)]*[+*]\))'
  - language: python
    pattern: '(?:\((?:[^)]*\+|\*)\)\+|\((?:[^)]*\+|\*)\)\*|\(\?:[^)]*[+*][^)]*[+*]\))'
  - language: java
    pattern: '(?:\((?:[^)]*\+|\*)\)\+|\((?:[^)]*\+|\*)\)\*)'
  # 末尾锚定无限量词家族：换行符 + 量词 + 字符串尾锚点，匹配到串尾的回溯瓶颈。
  # 真实案例 turndown CVE-2025-9670（replace 里用该类正则裁剪换行，修复版改为字符串裁剪）。
  # 已核对：命中漏洞版 v7.2.1，不命中修复版 v7.2.2。
  - language: javascript
    pattern: '\\n\+\$'
  - language: javascript
    pattern: '\^\\n\+\|'
  - language: typescript
    pattern: '\\n\+\$'
  - language: typescript
    pattern: '\^\\n\+\|'
  - language: python
    pattern: '\\n\+\$'
  - language: java
    pattern: '\\n\+\$'
severity: medium
