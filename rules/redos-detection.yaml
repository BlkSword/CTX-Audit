category: dos
cwe: CWE-1333
description: 检测正则表达式拒绝服务（ReDoS）风险：包含灾难性回溯的正则模式
id: redos-detection
language: all
name: Regular Expression Denial of Service (ReDoS) Detection
owasp: "A05:2021-Security Misconfiguration"
remediation: "避免使用嵌套量词（如 (a+)+）；使用原子组或占有量词；限制正则匹配超时；使用安全正则库或静态分析工具检测危险模式。"
references:
  - "https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS"
  - "https://cwe.mitre.org/data/definitions/1333.html"
patterns:
  - language: javascript
    pattern: '(?:\((?:[^)]*\+|\*)\)\+|\((?:[^)]*\+|\*)\)\*|\(\?:[^)]*[+*][^)]*[+*]\))'
  - language: python
    pattern: '(?:\((?:[^)]*\+|\*)\)\+|\((?:[^)]*\+|\*)\)\*|\(\?:[^)]*[+*][^)]*[+*]\))'
  - language: java
    pattern: '(?:\((?:[^)]*\+|\*)\)\+|\((?:[^)]*\+|\*)\)\*)'
  # 锚定无限量词的**泛化版**：前置运算符 + 正则字面量 + 任意字符类 + `[*+]` + 串尾锚点。
  # 触发形态：`replace(/\s*$/, '')`、`replace(/ +$/, '')`、`replace(/[ \t]+$/, '')`。
  # 真实漏报驱动（漏洞版命中、修复版豁免）：axios-CVE-2021-3749、markdown-it-CVE-2022-21670、
  # turndown-CVE-2025-9670。旧实现把该家族硬编码成 `\n` 与 `+`，只覆盖了其中一条。
  #
  # 误报控制（三条实测约束，缺一即产生成批误报）：
  # ① 模式体排除 `^` ⇒ **双锚定**的线性正则（`/^\s+$/`）不命中；
  # ② 模式体排除未转义 `/` 与 `"`/`'` ⇒ 正则**内部**的转义斜杠（`\/`）或字符类里的引号
  #    不会被误当字符串/正则分隔符（实测不排除会误报 15 条 validator.js 语言正则）；
  # ③ 必须由**前置运算符**起头（`= ( , : [ ! & | ? { } ;`）⇒ 不会从行中任意位置起匹配。
  - language: javascript
    pattern: >-
      [=(,:\[!&|?{};]\s*/(?:[^/\\^"'\n]|\\[^/])*[*+]\$
  - language: javascript
    pattern: >-
      /\^(?:\\[A-Za-z]|\[[^\]\n]*\])[*+]\|(?:\\[A-Za-z]|\[[^\]\n]*\])[*+]\$
  - language: typescript
    pattern: >-
      [=(,:\[!&|?{};]\s*/(?:[^/\\^"'\n]|\\[^/])*[*+]\$
  - language: typescript
    pattern: >-
      /\^(?:\\[A-Za-z]|\[[^\]\n]*\])[*+]\|(?:\\[A-Za-z]|\[[^\]\n]*\])[*+]\$
  - language: python
    pattern: >-
      [=(,:\[!&|?{};]\s*/(?:[^/\\^"'\n]|\\[^/])*[*+]\$
  - language: python
    pattern: >-
      /\^(?:\\[A-Za-z]|\[[^\]\n]*\])[*+]\|(?:\\[A-Za-z]|\[[^\]\n]*\])[*+]\$
  - language: java
    pattern: >-
      [=(,:\[!&|?{};]\s*/(?:[^/\\^"'\n]|\\[^/])*[*+]\$
  - language: java
    pattern: >-
      /\^(?:\\[A-Za-z]|\[[^\]\n]*\])[*+]\|(?:\\[A-Za-z]|\[[^\]\n]*\])[*+]\$
severity: medium
