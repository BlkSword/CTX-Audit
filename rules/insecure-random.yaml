category: cryptography
cwe: CWE-330
owasp: "A02:2021-Cryptographic Failures"
remediation: "使用密码学安全的随机数生成器（如 secrets 模块、crypto.randomBytes）; 不要使用 Math.random() 或 random.random() 用于安全目的。"
references:
  - "https://owasp.org/www-community/vulnerabilities/Insecure_Randomness"
  - "https://cwe.mitre.org/data/definitions/330.html"
description: 检测不安全的随机数生成：使用弱随机数生成器
id: insecure-random
language: all
name: Insecure Random Number Generation
patterns:
  # 仅匹配实例化弱随机（new Random(...)）与 Math.random()；
  # 不匹配类型引用（java.util.Random 变量/参数声明），避免把 SecureRandom 用法误报为弱随机
  - language: java
    pattern: (?i)(new\s+(?:java\.util\.)?Random\s*\(|(?:java\.lang\.)?Math\.random\s*\()
  - language: javascript
    pattern: (?i)Math\.random\s*\(\)
  - language: python
    pattern: (?i)(random\.random\s*\(\)|random\.randint\s*\(|random\.choice\s*\()
  - language: php
    pattern: (?i)(rand\s*\(\)|mt_rand\s*\()
severity: medium
