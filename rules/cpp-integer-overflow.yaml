category: security-misconfiguration
cwe: CWE-120
description: 检测 C/C++ 整数溢出导致的缓冲区问题
id: cpp-integer-overflow
language: cpp
name: C/C++ Integer Overflow Detection
owasp: "A04:2021-Insecure Design"
patterns:
  - language: c
    pattern: '(?i)(malloc\s*\(\s*\w+\s*\*\s*\w+|calloc\s*\(\s*\w+\s*,\s*\w+|realloc\s*\(\s*[^,]+,\s*\w+\s*\*\s*\w+)'
  - language: cpp
    pattern: '(?i)(malloc\s*\(\s*\w+\s*\*\s*\w+|calloc\s*\(\s*\w+\s*,\s*\w+|realloc\s*\(\s*[^,]+,\s*\w+\s*\*\s*\w+)'
severity: high
remediation: "使用 size_t 类型存储大小；乘法分配前检查是否溢出；使用 calloc 替代 malloc+memset；使用安全的分配函数（如 reallocarray）。"
references:
  - "https://cwe.mitre.org/data/definitions/120.html"
