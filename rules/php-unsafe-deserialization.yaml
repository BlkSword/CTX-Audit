category: security-misconfiguration
cwe: CWE-502
description: 检测 PHP 不安全反序列化：unserialize 直接使用超全局用户输入（$_GET/$_POST/$_REQUEST/$_COOKIE），可导致 PHP 对象注入
id: php-unsafe-deserialization
language: php
name: PHP Unsafe Deserialization
owasp: "A08:2021-Software and Data Integrity Failures"
patterns:
  - language: php
    # 排除方法/静态调用形态（->unserialize(、::unserialize(）——自定义同名方法不是内建反序列化
    pattern: '(?i)(?:^|[^\w.>:])unserialize\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)'
severity: critical
remediation: "使用 json_decode 替代 unserialize；如必须使用，设置 allowed_classes 选项；避免反序列化用户可控数据。"
references:
  - "https://owasp.org/www-community/vulnerabilities/PHP_Object_Injection"
