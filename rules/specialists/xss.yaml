name: xss
cwe_ids:
  - CWE-79
vuln_type_keywords:
  - xss
  - cross_site_scripting
  - cross site scripting
  - reflected_xss
  - stored_xss
  - dom_xss
sink_patterns:
  - '(?i)(\.innerHTML\s*=|\.outerHTML\s*=|\.html\s*\()'
  - '(?i)(document\.write\s*\(|document\.writeln\s*\()'
  - '(?i)(eval\s*\(|setTimeout\s*\(|setInterval\s*\()'
  - '(?i)(dangerouslySetInnerHTML|v-html|\{@html)'
  - '(?i)(res\.send\s*\(|res\.write\s*\(|response\.write\s*\()'
safe_patterns:
  - '(?i)(textContent|innerText|createTextNode|\.text\s*\()'
  - '(?i)(DOMPurify|sanitize|encodeURIComponent|escapeHtml|htmlEscape)'
  - '(?i)(setAttribute\s*\(\s*[''"](href|src)[''"]\s*,)'
barrier_keywords:
  - DOMPurify
  - sanitize
  - encodeURIComponent
  - escapeHtml
  - textContent
  - innerText
  - createTextNode
per_language:
  java:
    sink_patterns:
      - '(?i)(response\.getWriter\s*\(\s*\)\.\s*(print|println|write)|out\.print|out\.println)'
      - '(?i)(\.getOutputStream\s*\(\s*\)\.\s*write)'
      - '(?i)(model\.addAttribute\s*\(|ModelAndView)'
    safe_patterns:
      - '(?i)(escapeHtml|encodeForHTML|OWASP\.encoder|HtmlUtils)'
      - '(?i)(setContentType\s*\(\s*["''"]text/plain["''"]\s*\))'
  python:
    sink_patterns:
      - '(?i)(render_template\s*\(|render\s*\()'
      - '(?i)(return\s+.*\.format\s*\(|f["''"].*\{)'
      - '(?i)(HttpResponse\s*\(|JsonResponse\s*\()'
    safe_patterns:
      - '(?i)(|safe|escape|autoescape|mark_safe)'
