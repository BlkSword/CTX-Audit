name: sqli
cwe_ids:
  - CWE-89
vuln_type_keywords:
  - sqli
  - sql_injection
  - sql injection
sink_patterns:
  - '(?i)(\.query\s*\(|\.execute\s*\(|\.exec\s*\(|\.raw\s*\(|\.run\s*\()'
  - '(?i)(createStatement|prepareStatement|Statement\s+\w+)'
  - '(?i)(sqlite3|mysql|pg_|sequelize|knex|typeorm)'
safe_patterns:
  - '(?i)(\?\s*[),''"]|\$\d+|:\w+|\{\w+\})'
  - '(?i)(setString|setObject|setInt|bindValue|bindParam|bindParameters)'
  - '(?i)(parameterized|prepared|escape|stringify)'
barrier_keywords:
  - parameterized
  - prepared statement
  - bind
  - escape
  - mysql_real_escape_string
  - pg_escape_string
  - SqlParameter
per_language:
  java:
    sink_patterns:
      - '(?i)(Statement\s*\.\s*execute|PreparedStatement\s*\.\s*execute|CallableStatement\s*\.\s*execute)'
      - '(?i)(\.executeQuery\s*\(|\.executeUpdate\s*\(|\.executeBatch\s*\()'
      - '(?i)(createStatement\s*\(|prepareStatement\s*\()'
    safe_patterns:
      - '(?i)(setString\s*\(|setObject\s*\(|setInt\s*\(|setNull\s*\()'
      - '(?i)(PreparedStatement|CallableStatement)'
  python:
    sink_patterns:
      - '(?i)(cursor\s*\.\s*execute|cursor\s*\.\s*executemany|\.raw\s*\()'
      - '(?i)(sqlite3|MySQLdb|psycopg2|pyodbc|sqlalchemy\.text)'
    safe_patterns:
      - '(?i)(%s\s*[),]|paramstyle|placeholder)'
      - '(?i)(execute\s*\(\s*["''"][^"'']*%s)'
  go:
    sink_patterns:
      - '(?i)(db\s*\.\s*Query|db\s*\.\s*Exec|db\s*\.\s*QueryRow|db\s*\.\s*Prepare)'
      - '(?i)(sql\s*\.\s*DB)'
    safe_patterns:
      - '(?i)(\?\s*[),''"])'
