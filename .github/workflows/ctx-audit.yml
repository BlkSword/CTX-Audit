name: CTX-Audit Security Scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 从本次 checkout 构建，不通过 `cargo install --git` 拉取其它仓库：
      # 构建源必须与本次 PR 的代码一致，且不引入外部仓库作为 CI 执行路径。
      - name: Build from this checkout
        run: |
          cargo build --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Run Security Scan
        run: |
          ctx-audit scan . -o results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: ctx-audit

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctx-audit-results
          path: results.sarif
          retention-days: 30
