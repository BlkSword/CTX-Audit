name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ctx-audit-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ctx-audit-windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ctx-audit-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ctx-audit-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ctx-audit dist/
          cp target/${{ matrix.target }}/release/ctx-audit-daemon dist/
          cp -r rules dist/rules
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          copy target/${{ matrix.target }}/release/ctx-audit.exe dist/
          copy target/${{ matrix.target }}/release/ctx-audit-daemon.exe dist/
          xcopy rules dist\rules\ /E /I
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CTX-Audit 3.0.0
          body_path: RELEASE_NOTES_3.0.0.md
          files: artifacts/**/*
          generate_release_notes: true
